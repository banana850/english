<div id="phone">
  <div id="status"><span id="stime">23:58</span><span class="bat"><span id="sbat">41%</span><i><b id="sbatb"></b></i></span></div>
  <div id="screen"></div>
  <div id="homebar"><button id="home" aria-label="Home"></button></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem("sh_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("sh_"+k,JSON.stringify(v))}catch(e){}},raw(k){try{return localStorage.getItem("sh_"+k)}catch(e){return null}}};
const SET=Object.assign({sfx:true,voice:true,zh:false},LS.get("set",{}));
document.body.classList.toggle("allzh",SET.zh);
console.log("%cStarlight FM 87.9 — please stand by.","color:#7cf29a;font:16px monospace");

/* ---------- audio ---------- */
let AC=null,M=null,NB=null,stat=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();M=AC.createGain();M.gain.value=SET.sfx?.8:0;M.connect(AC.destination);NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter();f.type="bandpass";f.frequency.value=1800;f.Q.value=.6;stat=AC.createGain();stat.gain.value=0;s.connect(f).connect(stat).connect(M);s.start()}catch(e){AC=null}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,t="sine",v=.15,t0=0){if(!ac())return;const T=AC.currentTime+t0,o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(v,T+.01);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(g).connect(M);o.start(T);o.stop(T+d+.05)}
function nz(d,v=.2,fq=1200,t0=0){if(!ac())return;const T=AC.currentTime+t0,s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.frequency.value=fq;const g=AC.createGain();g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.0001,T+d);s.connect(f).connect(g).connect(M);s.start(T,Math.random());s.stop(T+d+.05)}
const SFX={ding(){tone(1318,.18,"sine",.12);tone(1760,.3,"sine",.1,.09)},tap(){tone(1900,.03,"square",.03)},key(){tone(1100,.06,"sine",.08)},bad(){tone(180,.25,"square",.06)},ok(){tone(880,.1);tone(1320,.18,"sine",.12,.08)},
 glitch(){for(let i=0;i<6;i++){nz(.05,.25,400+Math.random()*3000,i*.06);tone(60+Math.random()*900,.05,"square",.05,i*.06)}},ring(){[0,.4,1.2,1.6].forEach(t=>{tone(660,.35,"sine",.09,t);tone(880,.35,"sine",.06,t)})},thud(){tone(60,.4,"sine",.4);nz(.2,.3,200)},
 box(){const mel=[784,659,523,659,784,1046,988,784,659,587,659,523];mel.forEach((f,i)=>{tone(f,.9,"sine",.06,i*.42);tone(f*2,.4,"triangle",.015,i*.42)})}};
function sfx(n){if(SET.sfx)try{SFX[n]()}catch(e){}}
function staticVol(v){if(ac()&&stat)stat.gain.setTargetAtTime(SET.sfx?v:0,AC.currentTime,.15)}
const tts=window.speechSynthesis;
const NOV=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Junior|Ralph|Kathy|Fred|Princess|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
const VOICE={nm:[.35,.78,3],lena:[1.1,.9,1],theo:[1.7,.95,2],imp:[.9,.85,1],me:[1,.92,0]};
function speak(t,who="me",slow){if(!tts||!SET.voice)return;try{tts.cancel();const v=VOICE[who]||VOICE.me,u=new SpeechSynthesisUtterance(t.replace(/[~*"“”]/g,""));u.lang="en-US";u.pitch=v[0];u.rate=slow?.7:v[1];const vs=tts.getVoices().filter(x=>/^en[-_]US/i.test(x.lang)&&!NOV.test(x.name));if(vs.length)u.voice=vs[v[2]%vs.length];tts.speak(u)}catch(e){}}
function speakSeq(lines,who){return new Promise(res=>{if(!tts||!SET.voice){setTimeout(res,lines.length*1800);return}let i=0;const nx=()=>{if(i>=lines.length)return res();const u=new SpeechSynthesisUtterance(lines[i++].replace(/[~*"“”]/g,""));const v=VOICE[who];u.lang="en-US";u.pitch=v[0];u.rate=v[1];const vs=tts.getVoices().filter(x=>/^en[-_]US/i.test(x.lang)&&!NOV.test(x.name));if(vs.length)u.voice=vs[v[2]%vs.length];let done=false;const fin=d=>{if(done)return;done=true;clearTimeout(to);setTimeout(nx,d)};const to=setTimeout(()=>fin(0),2500+u.text.length*110);u.onend=()=>fin(350);u.onerror=()=>fin(600);tts.speak(u)};tts.cancel();nx()})}

/* ---------- words ---------- */
const WORDS={"second-hand":"二手的","previous owner":"前主人","missing":"失踪的","broadcast":"广播","frequency":"频率","static":"杂音","guest":"客人","lullaby":"摇篮曲","fountain":"喷泉","loading dock":"装卸区","service door":"服务通道门","keypad":"密码键盘","booth":"播音间","backwards":"倒着","password":"密码","deleted":"删除的","polite":"有礼貌的","basement":"地下室","staff only":"员工专用","disappear":"消失","forum":"论坛","last seen":"最后被看到","tape":"磁带","stopped":"停了","newest":"最新的","oldest":"最旧的","return":"退回","erase":"抹掉","signal":"信号","escalator":"自动扶梯","flashlight":"手电筒"};
const WK=Object.keys(WORDS).sort((a,b)=>b.length-a.length);const WRE=new RegExp("\\b("+WK.map(k=>k.replace(/[-]/g,"\\-").replace(/ /g,"\\s")).join("|")+")\\b","gi");
function mw(en){return esc(en).replace(WRE,m=>`<span class="kw" title="${WORDS[m.toLowerCase()]||""}">${m}</span>`)}
const tr=(en,zh,cls="")=>`<div class="tr ${cls}"><div>${mw(en)}</div><div class="zh">${esc(zh)}</div></div>`;
document.addEventListener("click",e=>{const t=e.target.closest(".tr,.b");if(t&&!e.target.closest("button,a,input")){t.classList.toggle("show")}});

/* ---------- state ---------- */
let S=null;
const P=()=>S.name;
function fresh(name){return{name,min:-2,bat:41,view:{app:"home"},threads:JSON.parse(JSON.stringify(BASE)),order:["resell","bug","mom","jun"],unread:{resell:1},pend:{},F:{},att:0,memos:["m1","m2","m3"],seen:{},mall:null,got:[]}}
function save(){if(S&&!S.over)LS.set("state",S)}
const fmt=m=>{m=Math.floor(m);m=((m%1440)+1440)%1440;return String(m/60|0).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};

function addMsg(id,m,silent){

 else{const b=document.createElement("button");b.className="lk";b.innerHTML="🔒<span>Use Passcode</span><span>输入手机密码查看</span>";b.onclick=()=>passcode("Enter iPhone Passcode","手机密码","1219",()=>{flag("delOpen");go("photos",{tab:"del"})});pg.appendChild(b)}

function viewer(id,label){
 flag("ph_"+id);
 const box=document.createElement("div");box.className="viewer";box.innerHTML=`<div class="vt"><span>${esc(label)}</span><button>Done</button></div><div class="vb"></div><div class="vh">双击放大/还原 · 拖动查看 · 双指缩放</div>`;
 scr.appendChild(box);box.querySelector("button").onclick=()=>box.remove();
 const vb=box.querySelector(".vb"),c=photoCanvas(id);vb.appendChild(c);
 let s=1,x=0,y=0,base=1;const fit=()=>{base=Math.min(vb.clientWidth/600,vb.clientHeight/800)};
 const apply=()=>{const sc=base*s;const mx=Math.max(0,(600*sc-vb.clientWidth)/2),my=Math.max(0,(800*sc-vb.clientHeight)/2);x=Math.max(-mx,Math.min(mx,x));y=Math.max(-my,Math.min(my,y));c.style.transform=`translate(${x-300*sc}px,${y-400*sc}px) scale(${sc})`};
 requestAnimationFrame(()=>{fit();apply()});
 const pts=new Map();let last=0,pd=0,ps=1;
 vb.addEventListener("pointerdown",e=>{vb.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2){const a=[...pts.values()];pd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);ps=s}
  const now=Date.now();if(now-last<300&&pts.size===1){const r=vb.getBoundingClientRect(),cx=e.clientX-r.left-r.width/2,cy=e.clientY-r.top-r.height/2;if(s>1){s=1;x=y=0}else{s=3;x=-cx*2;y=-cy*2}apply()}last=now});
 vb.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);if(pts.size===1){x+=e.clientX-p.x;y+=e.clientY-p.y;apply()}pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2){const a=[...pts.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);s=Math.max(1,Math.min(5,ps*d/pd));apply()}});
 const up=e=>pts.delete(e.pointerId);vb.addEventListener("pointerup",up);vb.addEventListener("pointercancel",up);
 vb.addEventListener("wheel",e=>{e.preventDefault();s=Math.max(1,Math.min(5,s*(e.deltaY<0?1.15:.87)));apply()},{passive:false});
}
function passcode(title,zh,code,ok,hint){
 let v="";const box=document.createElement("div");box.className="viewer";box.style.background="#0a0b0e";
 box.innerHTML=`<div class="vt"><span></span><button>Cancel</button></div><div style="text-align:center;margin-top:30px"><div style="font-size:18px">${esc(title)}</div><div style="color:var(--dim);font-size:13px">${esc(zh)}${hint?"<br>Hint: "+esc(hint):""}</div><div class="dots">${"<i></i>".repeat(code.length)}</div></div><div class="pad">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button data-k="${k}">${k}</button>`).join("")}</div>`;
 scr.appendChild(box);box.querySelector(".vt button").onclick=()=>box.remove();
 const dots=box.querySelectorAll(".dots i");const upd=()=>dots.forEach((d,i)=>d.classList.toggle("f",i<v.length));
 box.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{sfx("key");const k=b.dataset.k;if(k==="⌫")v=v.slice(0,-1);else if(v.length<code.length)v+=k;upd();
  if(v.length===code.length){if(v===code){sfx("ok");setTimeout(()=>{box.remove();ok()},250)}else{sfx("bad");const d=box.querySelector(".dots");d.classList.add("shake");setTimeout(()=>{d.classList.remove("shake");v="";upd()},400)}}});
}

  o.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{sfx("key");seq.push(names[+b.dataset.n]);draw()});

 draw();
}
