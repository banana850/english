<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>Closing Time</title>
<link rel="stylesheet" href="https://fonts.googleapis.cn/css2?family=VT323&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#07080c;--ink:#ebe7dc;--dim:#8f8d86;--acc:#7cf29a;--red:#ff5d5d;--panel:#101218;--line:#262a33}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center}
body.land #app{flex-direction:row;justify-content:center;align-items:center;gap:10px}
#stage{position:relative;flex:none;background:#000;overflow:hidden}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;left:0;right:0;top:0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;padding:6px 8px}
#clock{font-family:VT323,ui-monospace,monospace;font-size:22px;color:var(--acc);background:rgba(0,0,0,.6);padding:0 8px;border-radius:4px;letter-spacing:1px;line-height:26px}
.hbtns{display:flex;gap:6px;pointer-events:auto}
.hb{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:2px 9px;font-size:13px;line-height:22px}
.hb[hidden]{display:none}
#panel{flex:1;width:100%;max-width:760px;display:flex;flex-direction:column;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));min-height:0}
body.land #panel{width:330px;flex:none;max-width:none;height:100%;justify-content:flex-end;padding:10px 10px calc(10px + env(safe-area-inset-bottom)) 0}
#sub{flex:1;min-height:96px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;position:relative;overflow:auto;cursor:pointer}
#sub .who{font-size:12px;font-weight:700;letter-spacing:.5px;margin-bottom:2px}
#sub .en{font-size:18px;line-height:1.45;min-height:26px}
#sub.think .en{font-style:italic;color:#c9c6bd}
#sub .zh{color:var(--dim);font-size:14px;margin-top:4px}
#sub .tools{display:flex;gap:6px;align-items:center;margin-top:8px}
.tb{background:#1a1d25;border:1px solid var(--line);border-radius:6px;padding:1px 9px;font-size:13px}
.nx{margin-left:auto;color:var(--dim);font-size:12px;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(2px)}}
.kw{color:#ffd77a;font-weight:600;border-bottom:1px dashed rgba(255,215,122,.5)}
#sub .idle{color:var(--dim);font-size:14px}
#sub .idle b{color:var(--ink);font-weight:600}
#sub .prev{color:var(--dim);font-size:13px;margin-bottom:8px}
.choices{display:grid;gap:7px}
.ch{text-align:left;background:#191c24;border:1px solid #333847;border-radius:8px;padding:8px 11px;display:flex;flex-direction:column}
.ch span{font-size:16px}
.ch small{color:var(--dim);font-size:12.5px}
.ch:active,.ch:hover{border-color:var(--acc)}
#pad{display:grid;grid-template-columns:72px 72px 1fr;gap:8px;flex:none}
#pad button{height:62px;border-radius:12px;background:#171a22;border:1px solid #2c303b;font-size:24px}
#pad button.on{background:#232835}
#bA{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
#bA b{font-size:17px}
#bA small{font-size:11.5px;color:var(--dim)}
#bA.has{border-color:var(--acc);box-shadow:0 0 0 1px rgba(124,242,154,.25) inset}
#modal{position:fixed;inset:0;background:rgba(3,4,8,.82);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.show{display:flex}
.mbox{background:#12141b;border:1px solid #2a2e3a;border-radius:14px;padding:18px;max-width:560px;width:100%;max-height:100%;overflow:auto;-webkit-user-select:text;user-select:text}
.mbox h2{margin:0 0 6px;font-size:20px}
.mbox p{margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{background:#1f2430;border:1px solid #363c4c;border-radius:9px;padding:9px 15px;font-size:15px}
.btn.pri{background:#1f6b45;border-color:#2c8f5d}
.paper{background:#f2ecd9;color:#1b1b1b;border-radius:4px;padding:16px 18px;font-family:"Bradley Hand","Segoe Print","Comic Sans MS","Kaiti SC",cursive;font-size:16px;line-height:1.45;transform:rotate(-.6deg);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.paper h3{margin:0 0 8px;font-size:19px;text-decoration:underline}
.rule{margin:7px 0;cursor:pointer}
.rule .z{display:none;color:#6b665a;font-family:system-ui,"PingFang SC",sans-serif;font-size:13px}
.rule.on .z,.paper.allz .z{display:block}
.rule.red{color:#a5121a;font-family:"Chalkduster","Marker Felt","Segoe Print",cursive;transform:rotate(.8deg) skewX(-5deg);letter-spacing:.3px}
.paper.old{background:#ddd3b6;font-size:15px;transform:rotate(1deg)}
.hint{color:var(--dim);font-size:12.5px;margin-top:10px}
.tasks{list-style:none;padding:0;margin:8px 0}
.tasks li{padding:6px 0;border-bottom:1px solid #22262f;display:flex;gap:9px}
.tasks li.done{color:var(--dim);text-decoration:line-through}
.tasks small{display:block;color:var(--dim);text-decoration:none}
#camc{width:100%;image-rendering:pixelated;border:6px solid #1b1d22;border-radius:8px;background:#000;display:block}
.bar{position:relative;height:34px;background:#1c2029;border-radius:8px;overflow:hidden;margin:14px 0}
.bar .zone{position:absolute;top:0;bottom:0;left:42%;width:16%;background:rgba(124,242,154,.35)}
.bar .mk{position:absolute;top:0;bottom:0;width:4px;background:#fff;left:0}
.bills{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.bill{background:#3a5a3a;border:1px solid #6f9a6a;border-radius:6px;padding:8px 12px;font-family:VT323,monospace;font-size:22px}
.title{font-family:VT323,monospace;font-size:64px;line-height:1;letter-spacing:3px;color:#e9e4d6;text-shadow:0 0 18px rgba(124,242,154,.25)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.gal div{background:#191c24;border:1px solid #2a2e3a;border-radius:8px;padding:8px 10px;font-size:13px}
.gal div b{display:block;font-size:14px}
.gal .lock{color:#555}
.end p.e{font-size:17px;margin:10px 0 0}
.end p.z{color:var(--dim);font-size:13.5px;margin:2px 0 0}
.wl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wl span{background:#1d2129;border:1px solid #2c3140;border-radius:6px;padding:3px 8px;font-size:13px}
.wl span i{font-style:normal;color:var(--dim);margin-left:4px}
.tog{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #22262f}
.sw{width:46px;height:26px;border-radius:13px;background:#333;border:0;position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#bbb;transition:.15s}
.sw.on{background:#1f8a55}.sw.on::after{left:23px;background:#fff}
.fade{animation:fin .5s}
@keyframes fin{from{opacity:0}}
#bar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:none}
#bar button{height:60px;border-radius:12px;background:#171a22;border:1px solid #2c303b;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-size:20px;padding:0}
#bar button small{font-size:11.5px;color:var(--dim)}
#bar button:disabled{opacity:.3}
#bS{border-color:#2c8f5d!important}#bX{border-color:#a33!important}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 12px}
.tabs button{background:#1a1d25;border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:13px}
.tabs button.on{border-color:var(--acc);color:var(--acc)}
.pg{display:flex;gap:12px;align-items:flex-start}
.pg canvas{width:96px;height:120px;image-rendering:pixelated;background:#3a4746;border-radius:6px;flex:none}
.facts{margin:0;padding:0;list-style:none;font-size:14.5px;flex:1}
.facts li{padding:4px 0;border-bottom:1px solid #22262f}
.facts small{display:block;color:var(--dim);font-size:12.5px}
.stamp{color:#ff4b4b;border:3px solid #ff4b4b;display:inline-block;padding:0 8px;font-weight:800;transform:rotate(-8deg);letter-spacing:2px;margin:6px 0}
.nt{background:#191c24;border:1px solid #2a2e3a;border-radius:8px;padding:8px 10px;margin:6px 0;font-size:14px}
.nt small{display:block;color:var(--dim)}
.card{text-align:center;padding:18px 0}
.card .title{font-size:52px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div id="clock">22:30</div>
      <div class="hbtns"><button class="hb" id="hSet">⚙</button></div>
    </div>
  </div>
  <div id="panel">
    <div id="sub"></div>
    <div id="bar">
      <button id="bB">📖<small>名册</small></button>
      <button id="bQ">💬<small>提问</small></button>
      <button id="bC">📹<small>监控</small></button>
      <button id="bS">✅<small>结账</small></button>
      <button id="bX">⛔<small>拒绝</small></button>
    </div>
  </div>
</div>
<div id="modal"></div>
<script>
"use strict";
let W=256;const H=160,FLOOR=134;
const $=s=>document.querySelector(s);
const cv=$("#cv"),ctx=cv.getContext("2d");cv.width=W;cv.height=H;
const LS={get(k,d){try{const v=localStorage.getItem("ct_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("ct_"+k,JSON.stringify(v))}catch(e){}}};
const SET=Object.assign({sfx:true,voice:true,zh:false},LS.get("set",{}));
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ================= audio ================= */
let AC=null,master=null,noiseBuf=null;const amb={};
function ac(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=SET.sfx?.9:0;master.connect(AC.destination);initAmb()}catch(e){AC=null}}
  if(AC&&AC.state==="suspended")AC.resume();return AC;
}
function nb(){if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return noiseBuf}
function initAmb(){
  const s=AC.createBufferSource();s.buffer=nb();s.loop=true;const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=1100;const g=AC.createGain();g.gain.value=0;s.connect(f).connect(g).connect(master);s.start();amb.rain=g;
  const o=AC.createOscillator(),o2=AC.createOscillator();o.frequency.value=58;o2.type="triangle";o2.frequency.value=117;const hg=AC.createGain();hg.gain.value=0;o.connect(hg);o2.connect(hg);hg.connect(master);o.start();o2.start();amb.hum=hg;
  const d1=AC.createOscillator(),d2=AC.createOscillator();d1.type=d2.type="sawtooth";d1.frequency.value=41;d2.frequency.value=41.6;const df=AC.createBiquadFilter();df.type="lowpass";df.frequency.value=170;const dg=AC.createGain();dg.gain.value=0;d1.connect(df);d2.connect(df);df.connect(dg).connect(master);d1.start();d2.start();amb.drone=dg;
}
function setAmb(n,v){if(AC&&amb[n])amb[n].gain.setTargetAtTime(v,AC.currentTime,.5)}
function tone(f,d,type="sine",v=.2,t0=0,slide){const t=AC.currentTime+t0,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)}
function noise(d,v=.2,freq=1000,type="lowpass",t0=0,q=1){const t=AC.currentTime+t0,s=AC.createBufferSource();s.buffer=nb();const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(master);s.start(t,Math.random());s.stop(t+d+.05)}
const SFX={
  chime(){tone(1046,.5,"sine",.14);tone(784,.8,"sine",.14,.28)},
  step(){noise(.05,.07,650)},stepOut(){noise(.06,.09,1500,"bandpass")},echo(){noise(.06,.075,420,"lowpass")},
  knock(){[0,.2,.4].forEach(t=>{noise(.12,.55,230,"lowpass",t);tone(85,.12,"sine",.35,t)})},
  ring(){[0,.5].forEach(t=>{tone(440,.42,"square",.045,t);tone(480,.42,"square",.045,t)})},
  beep(){tone(1800,.08,"square",.05)},cash(){tone(1318,.12,"triangle",.12);tone(1760,.25,"triangle",.1,.08);noise(.15,.08,3000,"highpass")},
  hiss(){noise(1.4,.13,2600,"highpass")},pour(){noise(1,.08,600,"bandpass",0,3)},
  box(){noise(.15,.25,400);tone(110,.12,"triangle",.14)},door(){noise(.5,.12,500);tone(150,.4,"triangle",.06,0,90)},
  click(){tone(2400,.03,"square",.04)},sting(){tone(98,1.8,"sawtooth",.1);tone(104,1.8,"sawtooth",.1);tone(1567,1.3,"sine",.035,0,1480)},
  mop(){noise(.3,.12,900,"bandpass",0,2)},ok(){tone(880,.1,"sine",.1);tone(1320,.16,"sine",.1,.08)},bad(){tone(200,.22,"square",.05)},
  sw(){tone(1200,.02,"square",.1);noise(.05,.2,2000)},tap(){noise(.05,.3,1600,"bandpass",0,4);noise(.05,.3,1600,"bandpass",.18,4)},
  lock(){tone(600,.05,"square",.07);tone(300,.08,"square",.07,.07)},car(){noise(2.4,.13,450)},thud(){tone(70,.3,"sine",.4);noise(.12,.2,300)},
  buzz(){noise(.25,.06,120,"lowpass")}
};
function sfx(n){if(!SET.sfx||!ac())return;try{SFX[n]()}catch(e){}}

/* ================= speech ================= */
const tts=window.speechSynthesis;
const NOVELTY=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Junior|Ralph|Kathy|Fred|Princess|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
function speak(text,pitch=1,rate=.92,vi=0){
  if(!tts)return;try{tts.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[*_"“”]/g,""));u.lang="en-US";u.rate=rate;u.pitch=pitch;
  const vs=tts.getVoices().filter(v=>/^en[-_]US/i.test(v.lang)&&!NOVELTY.test(v.name));if(vs.length)u.voice=vs[vi%vs.length];tts.speak(u)}catch(e){}
}
if(tts&&tts.onvoiceschanged!==undefined)tts.onvoiceschanged=()=>{};
/* ================= pixel font & draw helpers ================= */
const FONT={A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",E:"111100110100111",F:"111100110100100",G:"011100101101011",H:"101101111101101",I:"111010010010111",J:"001001001101010",K:"101101110101101",L:"100100100100111",M:"101111111101101",N:"110101101101101",O:"010101101101010",P:"110101110100100",Q:"010101101110011",R:"110101110101101",S:"011100010001110",T:"111010010010010",U:"101101101101111",V:"101101101101010",W:"101101111111101",X:"101101010101101",Y:"101101010010010",Z:"111001010100111",
"0":"111101101101111","1":"010110010010111","2":"110001010100111","3":"110001010001110","4":"101101111001001","5":"111100110001110","6":"011100111101111","7":"111001010010010","8":"111101111101111","9":"111101111001110",":":"000010000010000",".":"000000000000010","-":"000000111000000","/":"001001010100100","$":"011110010011110","!":"010010010000010","?":"110001010000010"," ":"000000000000000"};
let g=ctx,CX=0;
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x-CX),Math.round(y),w,h)}
function T(s,x,y,c){s=String(s).toUpperCase();g.fillStyle=c;let px=Math.round(x-CX);for(const ch of s){const f=FONT[ch];if(f)for(let i=0;i<15;i++)if(f[i]==="1")g.fillRect(px+i%3,y+(i/3|0),1,1);px+=4}}
function srand(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function ell(x,y,rx,ry,c){g.fillStyle=c;g.beginPath();g.ellipse(Math.round(x-CX),y,rx,ry,0,0,7);g.fill()}
const SUB=$("#sub");
let advanceFn=null,typing=false,typeTO=0;
function say(who,en,zh,o={}){
  return new Promise(res=>{
    const w=WHO[who];G.last={who,en,zh};
    SUB.className=(who==="think"?"think":"")+" fade";
    SUB.innerHTML=`<div class="who" style="color:${w.c}">${w.n}</div><div class="en"></div><div class="zh"${SET.zh?"":" hidden"}>${zh}</div><div class="tools"><button class="tb" data-a="spk">🔊 听</button><button class="tb" data-a="zh">中文</button><span class="nx">点击继续 ▼</span></div>`;
    const el=SUB.querySelector(".en"),html=markWords(en);let i=0;typing=true;
    const fin=()=>{clearTimeout(typeTO);typing=false;el.innerHTML=html};
    const tick=()=>{if(!typing)return;i+=2;el.textContent=en.slice(0,i);if(i>=en.length)fin();else typeTO=setTimeout(tick,26)};tick();
    if(SET.voice&&!w.quiet&&!o.mute)speak(en,w.v[0],o.slow?.7:w.v[1],w.v[2]);
    advanceFn=()=>{if(typing){fin();return}advanceFn=null;res()};
  });
}
function choose(opts){
  return new Promise(res=>{
    SUB.className="fade";
    const prev=G.last?`<div class="prev">${markWords(G.last.en)}</div>`:"";
    SUB.innerHTML=prev+`<div class="choices">${opts.map((o,i)=>`<button class="ch" data-i="${i}"><span>${o[0]}</span><small>${o[1]}</small></button>`).join("")}</div>`;
    G.choosing=v=>{G.choosing=null;sfx("click");res(v)};
    SUB.querySelectorAll(".ch").forEach(b=>b.onclick=e=>{e.stopPropagation();G.choosing&&G.choosing(opts[+b.dataset.i][2])});
    G.chOpts=opts;
  });
}
SUB.addEventListener("click",e=>{
  ac();const a=e.target.dataset&&e.target.dataset.a;
  if(a==="spk"){e.stopPropagation();if(G.last){const w=WHO[G.last.who];speak(G.last.en,w.v[0],w.v[1]*.85,w.v[2])}return}
  if(a==="zh"){e.stopPropagation();const z=SUB.querySelector(".zh");if(z)z.hidden=!z.hidden;return}
  if(advanceFn)advanceFn();
});
const MOD=$("#modal");
let modalSeq=0;function modal(html,setup){return new Promise(res=>{const id=++modalSeq;let done=0;MOD.className="show";MOD.innerHTML=`<div class="mbox fade">${html}</div>`;const close=v=>{if(done)return;done=1;if(id===modalSeq){MOD.className="";MOD.innerHTML="";G&&(G.modalOpen=false)}res(v)};if(G)G.modalOpen=true;MOD.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{sfx("click");close(b.dataset.close)});setup&&setup(MOD,close)})}
function brewGame(){
  return modal(`<h2>Brew coffee · 煮咖啡</h2><p>白条走到绿色区域时按下。</p><div class="bar"><div class="zone"></div><div class="mk" id="mk"></div></div><p id="bm" style="min-height:24px;color:var(--dim)"></p><div class="row"><button class="btn pri" id="stop" style="flex:1;font-size:18px">STOP · 按下</button></div>`,(m,close)=>{
    let live=true;const t0=performance.now(),mk=m.querySelector("#mk");
    const pos=()=>{const u=((performance.now()-t0)/1000*.95)%2;return u<1?u:2-u};
    const loop=()=>{if(!live)return;mk.style.left=(pos()*100)+"%";requestAnimationFrame(loop)};requestAnimationFrame(loop);
    m.querySelector("#stop").onclick=()=>{const p=pos();mk.style.left=(p*100)+"%";if(p>.41&&p<.59){live=false;sfx("hiss");m.querySelector("#bm").textContent="Perfect! 完美！";setTimeout(()=>close(1),700)}else{sfx("bad");m.querySelector("#bm").textContent=p<.41?"Too weak. Try again. 太淡了，再来。":"Too strong. Try again. 太浓了，再来。"}};
  });
}
function nw(n){const o=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"],t=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];if(n<20)return o[n];if(n<100)return t[n/10|0]+(n%10?"-"+o[n%10]:"");return o[n/100|0]+" hundred"+(n%100?" and "+nw(n%100):"")}
function countGame(){

    if(n===3){const u=REG[G.chgB].chgPa;G.updates.push([u[1],u[2]]);b("Update for the book: "+u[1],"名册更新："+u[2]);b("Tonight is Friday. I'll be there at 1 a.m. Have the keys ready. — Park","今晚是周五。我凌晨 1 点到。把钥匙准备好。——朴")}
  }
  return modal(`<div class="paper"><h3>${n===1?"Note from Mr. Park":"Text from Mr. Park"}</h3>${L.map(l=>`<div class="rule"><div>${markWords(l[0])}</div><div class="z">${l[1]}</div></div>`).join("")}</div><p class="hint">点一句可以看中文。更新内容会记在名册的「笔记」页。</p><div class="row"><button class="btn" id="allz">全部显示中文</button><button class="btn pri" data-close>好</button></div>`,m=>{m.querySelectorAll(".rule").forEach(r=>r.onclick=()=>r.classList.toggle("on"));m.querySelector("#allz").onclick=()=>m.querySelector(".paper").classList.toggle("allz")});
}
async function night(n){
  G.night=n;G.nightM=0;G.cam=n===1?0:n===2?3:G.cam;G.clock=22*60+30;G.flick=0;refresh();
  if(n===2){const c=shuf(Object.keys(REG).filter(i=>REG[i].chgLook&&!G.missing[i]));G.chgA=c[0]||"tom"}
  if(n===3){const c=shuf(Object.keys(REG).filter(i=>REG[i].chgPa&&!G.missing[i]&&i!==G.chgA));G.chgB=c[0]||"grace"}
  await card(n);setAmb("rain",.06);setAmb("hum",.05);setAmb("drone",[0,.03,.07][n-1]);
  await parkNote(n);
  if(n===1){await say("think","Okay. The book is under the counter. I can do this.","好。名册在柜台下面。我能行。")}
  const S=build(n);
  for(let i=0;i<S.length;i++){
    G.clock=TIMES[n-1][i];refresh();await wait(700);
    if(i===3)await breakTime();
    if(n===3&&i===4){G.flick=1;sfx("buzz");await wait(600);G.flick=0}
    await encounter(S[i]);
  }
  G.clock=24*60+52;refresh();
  await say("think","Almost one o'clock. Time to count the register.","快一点了。该点算收银机了。");await countGame();
  G.pendShown=G.pend.filter(id=>!G.missing[id]);G.pendShown.forEach(id=>G.missing[id]=1);G.pend=[];
  G.newRef=Object.keys(G.refused).filter(id=>!G.refSeen||!G.refSeen[id]);G.refSeen=Object.assign({},G.refused);
  if(Object.keys(G.missing).length>=3)return ending("replaced");
  if(n<3){G.clock=25*60;refresh();sfx("lock");await say("think","One o'clock. Lock up and go home.","一点了。锁门回家。");return night(n+1)}
  return finale();
}
async function finale(){
  G.clock=24*60+56;refresh();
  const pf=G.pf,kf=G.kf;
  const allies=Object.keys(G.served).filter(id=>!G.missing[id]&&!G.refused[id]);
  if(allies.length>=4){const a=REG[allies[0]];sfx("ring");await wait(900);WHO.phone.n="📞 "+a.n;
    await say("think","The store phone is ringing.","店里的电话响了。");
    if(pf)await say("phone",`Mia? It's ${a.n}. Listen. I just saw Mr. Park across town. He's in the hospital. He can't be coming to the store.`,`Mia？我是 ${a.n}。听着，我刚在城另一头看到朴店长了。他在医院。他不可能去店里。`);
    else await say("phone",`Mia? It's ${a.n}. Kevin's mom was at the bus stop again tonight, with his poster. Nobody has seen him in a year. Be careful.`,`Mia？我是 ${a.n}。Kevin 的妈妈今晚又拿着寻人海报在公交站。一年了，没人见过他。小心点。`);
    await say("think","Thank you.","谢谢你。");}
  G.clock=25*60;refresh();sfx("buzz");G.flick=1;await wait(500);G.flick=0;
  G.noCam=1;await say("think","One o'clock. The camera screen just went black.","一点了。监控屏幕突然黑了。");
  sfx("knock");await say("think","Someone is knocking. A young man in a yellow raincoat. A green uniform under it... a name tag?","有人在敲门。一个穿黄雨衣的年轻人。雨衣下面是绿色制服……别着名牌？");
  const KL=Object.assign({},KEV.look);if(kf&&G.kWrong==="look")KL.bandage=0;
  const kc={kind:"kev",n:"Kevin?",v:[1,.9,2],look:KL,fake:kf,greet:kf&&G.kWrong==="greet"?["Hello. I am Kevin. I work here. Let me in.","你好。我是 Kevin。我在这里上班。让我进去。"]:["Good morning. ...Is it really you? The new night person? Please. Let me in.","早上好。……你就是新来的夜班吗？求你了，让我进去。"]};
  await say("think","✅ means I open the door. ⛔ means it stays locked.","✅ 就是开门。⛔ 就是继续锁着。");
  const r1=await encounter(kc);
  let bad=null,kevIn=false;
  if(r1==="serve"){await say("mia","Okay. Come in, quick.","好，快进来。");if(kf)bad="kevin";else{kevIn=true;await say("cust","Thank you. Thank you. It's so cold out there.","谢谢。谢谢。外面好冷。")}}
  else{await say("mia","Sorry. I can't.","对不起。我不能开。");await say("cust",kf?"...Okay.":"Please... I just want to go home.",kf?"……好吧。":"求你了……我只想回家。");}
  kc.tv=0;await wait(900);G.cur=null;
  if(bad)return ending("last",bad);
  await say("think","Car lights. A man in a brown coat gets out.","车灯。一个穿棕色外套的男人从车上下来。");
  const L=Object.assign({},PARK.look);if(pf&&G.parkWrong==="look")L.scar=0;
  const greet=pf&&G.parkWrong==="greet"?["Hello, Mia. Long week?","你好，Mia。这周很累吧？"]:["Hi, kid. Long week?","嘿，小家伙。这周很累吧？"];
  const c={kind:"park",n:"Mr. Park",v:[.7,.85,3],look:L,greet,fake:pf};
  const res=await encounter(c);
  if(res==="serve"){await say("mia","Here are the keys, Mr. Park.","钥匙给你，店长。");if(pf)return ending("last","keys")}
  else{await say("mia","Sorry. We're closed.","抱歉。我们打烊了。");
    if(!pf){await say("cust","Kid? It's me. Open the door. It's not safe out here.","小家伙？是我。开门。外面不安全。");return ending("last","locked")}
    await say("cust","...","……");await say("cust","Smart kid.","聪明的小家伙。",{slow:1});c.tv=0;await wait(1000);G.cur=null}
  const good=(kf||kevIn)&&G.notes>=2&&Object.keys(G.missing).length<=1;
  return ending(good?"true":"dawn",kf?"kf":"kr");
}

/* ================= endings ================= */
const END={
 replaced:{t:"Full House",z:"满座",L:[["The next night, the store is full when you arrive.","第二天晚上，你到店里时，店里已经挤满了人。"],["Tom. Lily. Grace. Everyone you know.","Tom、Lily、Grace。所有你认识的人。"],["They turn to you at the same time, with identical smiles.","他们同时转过头来看你，脸上是一模一样的笑容。"],["\"Long day, right?\" they all say. Together.","“今天好漫长啊，是吧？”他们一起说。"],["Under the counter, the book has a new page.","柜台下面，名册多了一页。"],["It has your face on it.","上面是你的脸。"]]},
 last:{t:"Open 24 Hours",z:"二十四小时营业",L:[]},
 dawn:{t:"Morning Shift",z:"早班",L:[["The sun comes up. The rain stops.","太阳升起来了。雨停了。"],["Mr. Park counts the money twice. Then he hands you an envelope.","朴店长把钱数了两遍，然后递给你一个信封。"],["\"You're good at this, kid. Same time next week?\"","“你干得不错，小家伙。下周同一时间？”"],["On your way out, you look back at the window.","出门时，你回头看了一眼橱窗。"],["For a second, you see a young man in a green uniform behind the counter. He waves.","有那么一瞬间，你看到柜台后面站着一个穿绿色制服的年轻男人。他朝你挥了挥手。"],["Then he's gone.","然后他就不见了。"]]},
 true:{t:"Two Names in the Book",z:"名册上的两个名字",L:[["At 5 a.m., the young man in the raincoat is still asleep by the heater.","凌晨五点，穿雨衣的年轻人还在暖气旁睡着。"],["He wakes up. Warm. Confused.","他醒了。暖和了，但一脸茫然。"],["\"What day is it?\" Kevin asks again. \"I... I think I work here.\"","“今天几号？”他问，“我……我好像在这里上班。”"],["Behind him, Mr. Park drops his tea.","他身后，朴店长手里的茶掉在了地上。"],["\"Kevin?\"","“Kevin？”"],["You didn't let them take one more face. So they had to give one back.","你没让它们再拿走一张脸。所以它们只好还回来一张。"],["You add a new page to the book. KEVIN — night shift. Always comes back.","你在名册上加了新的一页：KEVIN——夜班。总会回来。"]]}
};
const LASTV={kevin:[["He steps inside and shakes the rain off his coat.","他走进来，抖了抖雨衣上的水。"],["\"Thanks,\" he says. Then he walks behind the counter. Next to you.","“谢了。”他说。然后他走到柜台后面。站在你旁边。"],["\"I'll take it from here.\"","“接下来交给我吧。”"],["When Mr. Park arrives, there are two night clerks smiling at him.","朴店长到的时候，有两个夜班店员对着他微笑。"],["One of them is wearing your name tag.","其中一个别着你的名牌。"]],keys:[["He takes the keys. His smile is a little too wide.","他接过钥匙。笑容咧得有点太开了。"],["\"Thanks, kid,\" it says, in Mr. Park's voice.","“谢了，小家伙。”它用朴店长的声音说。"],["The lights go out, one by one.","灯一盏一盏地灭了。"],["The next night, CORNER STOP is open 24 hours.","第二天晚上，街角便利店变成了 24 小时营业。"],["Mr. Park is behind the counter. So are you.","朴店长在柜台后面。你也在。"],["Neither of you ever closes your eyes.","你们俩都没有眨眼。"]],locked:[["\"Kid. Please.\"","“小家伙。求你了。”"],["You don't open the door.","你没有开门。"],["At 3 a.m., something else starts knocking. Then the knocking stops.","凌晨三点，有别的东西开始敲门。然后，敲门声停了。"],["In the morning, Mr. Park's car is still outside. The door is open. Nobody is in it.","早上，朴店长的车还停在外面。车门开着，里面没有人。"],["The next Friday, a man in a brown coat comes to pick up the keys.","下个周五，一个穿棕色外套的男人来拿钥匙。"],["\"Hello, Mia,\" he says.","“你好，Mia。”他说。"]]};
const ORDER=["replaced","last","dawn","true"];
const TRUEF=[["Mr. Park looks at the empty street for a long time.","朴店长盯着空荡荡的街道看了很久。"],["\"That wasn't Kevin,\" he says quietly. \"Kevin would have said good morning.\"","“那不是 Kevin，”他轻声说，“Kevin 会先说一声早上好。”"],["At 5 a.m., a phone rings in the lost-and-found box. Kevin's phone. Missing for a year.","凌晨五点，失物招领箱里有部手机响了。是 Kevin 的手机，丢了整整一年。"],["One text message: \"thank you. i'm walking home now.\"","一条短信：“谢谢你。我在走回家的路上了。”"],["You add a new page to the book. KEVIN — night shift. On his way home.","你在名册上加了一页：KEVIN——夜班。在回家的路上。"]];
async function ending(id,v){
  G.over=true;G.busy=true;G.deciding=false;advanceFn=null;refresh();setAmb("drone",id==="dawn"||id==="true"?0:.1);
  if(id==="last"||id==="replaced"){sfx("sting");G.flick=1}
  await wait(1200);
  const got=LS.get("end2",[]);if(!got.includes(id)){got.push(id);LS.set("end2",got)}
  const e=END[id],L=id==="last"?LASTV[v]:id==="true"&&v==="kf"?TRUEF:e.L,words=[...G.words].slice(0,24);
  SUB.innerHTML="";setAmb("rain",0);setAmb("hum",0);
  const why=id==="dawn"?`<p class="hint">好像还有一个更完整的结局。</p>`:id==="replaced"?"":"";
  modal(`<div class="end"><p style="color:var(--dim);margin:0">ENDING ${ORDER.indexOf(id)+1} / 4</p><h2 style="font-family:VT323,monospace;font-size:34px;font-weight:400;margin:2px 0">${e.t}</h2><p style="color:var(--dim);margin-top:0">${e.z}</p>
    ${L.map(l=>`<p class="e">${l[0]}</p><p class="z">${l[1]}</p>`).join("")}${why}
    <h3 style="margin:18px 0 0;font-size:15px">这次遇到的词</h3><div class="wl">${words.map(w=>`<span>${w}<i>${WORDS[w]}</i></span>`).join("")||"<span>—</span>"}</div>
    <div class="row"><button class="btn pri" data-close="again">重新开始</button><button class="btn" data-close="title">回标题</button></div></div>`).then(v=>{newGame();refresh();if(v==="again")startGame();else title()});
}

/* ================= loop & layout ================= */
let lastT=0;
function frame(ts){const dt=Math.min(.05,(ts-lastT)/1000||0);lastT=ts;if(G){G.t+=dt;if(G.cur)G.cur.vis+=(G.cur.tv-G.cur.vis)*Math.min(1,dt*3);if(G.night===3&&!G.flick&&Math.random()<.002){G.flick=1;setTimeout(()=>{if(G&&!G.over)G.flick=0},120)}draw()}requestAnimationFrame(frame)}
function layout(){
  const vw=innerWidth,vh=innerHeight,land=vw>vh*1.2&&vh<640;document.body.classList.toggle("land",land);
  const nw=(!land&&vw<vh)?Math.max(168,Math.min(256,Math.round(H*vw/(vh*.5)))):256;if(nw!==W){W=nw;cv.width=W}
  const aw=land?vw-350:vw,ah=land?vh-12:vh-270;let s=Math.max(1,Math.min(aw/W,ah/H));if(s>=3)s=Math.floor(s);
  const st=$("#stage");st.style.width=Math.floor(W*s)+"px";st.style.height=Math.floor(H*s)+"px";
}
addEventListener("resize",layout);layout();
new MutationObserver(()=>refresh()).observe(MOD,{attributes:true,attributeFilter:["class"]});

function title(){
  const got=LS.get("end2",[]);
  modal(`<div style="text-align:center"><div class="title">CLOSING TIME</div><p style="color:var(--dim);margin:6px 0 2px">便利店夜班 · 微恐 · 英文字幕</p></div>
  <p style="margin-top:14px">你是 Mia，刚接手街角便利店的夜班。店长说，最近有些东西会顶着常客的脸进店。</p>
  <p>三个夜晚。每位客人走到柜台前，你都要决定：卖，还是不卖。</p>
  <p class="hint">玩法：对照「名册」，看外表、听对话、提问（客人的耐心有限）；之后会有更多工具。字幕点「中文」看翻译，点「听」朗读。大约 20–30 分钟，建议戴耳机。</p>
  <div class="gal">${ORDER.map((id,i)=>got.includes(id)?`<div><b>${END[id].t}</b>${END[id].z}</div>`:`<div class="lock"><b>???</b>结局 ${i+1}</div>`).join("")}</div>
  <div class="row"><button class="btn pri" data-close="go" style="flex:1;font-size:17px">开始上班</button><button class="btn" id="tset">设置</button></div>
  <p class="hint" style="text-align:center"><a href="../" style="color:var(--dim)">← 回到游戏大厅</a></p>`,m=>{m.querySelector("#tset").onclick=()=>{settings().then(title)}}).then(v=>{if(v==="go")startGame()});
}

newGame();refresh();requestAnimationFrame(frame);title();
