<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>Closing Time</title>
<link rel="stylesheet" href="https://fonts.googleapis.cn/css2?family=VT323&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#07080c;--ink:#ebe7dc;--dim:#8f8d86;--acc:#7cf29a;--red:#ff5d5d;--panel:#101218;--line:#262a33}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center}
body.land #app{flex-direction:row;justify-content:center;align-items:center;gap:10px}
#stage{position:relative;flex:none;background:#000;overflow:hidden}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;left:0;right:0;top:0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;padding:6px 8px}
#clock{font-family:VT323,ui-monospace,monospace;font-size:22px;color:var(--acc);background:rgba(0,0,0,.6);padding:0 8px;border-radius:4px;letter-spacing:1px;line-height:26px}
.hbtns{display:flex;gap:6px;pointer-events:auto}
.hb{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:2px 9px;font-size:13px;line-height:22px}
.hb[hidden]{display:none}
#panel{flex:1;width:100%;max-width:760px;display:flex;flex-direction:column;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));min-height:0}
body.land #panel{width:330px;flex:none;max-width:none;height:100%;justify-content:flex-end;padding:10px 10px calc(10px + env(safe-area-inset-bottom)) 0}
#sub{flex:1;min-height:96px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;position:relative;overflow:auto;cursor:pointer}
#sub .who{font-size:12px;font-weight:700;letter-spacing:.5px;margin-bottom:2px}
#sub .en{font-size:18px;line-height:1.45;min-height:26px}
#sub.think .en{font-style:italic;color:#c9c6bd}
#sub .zh{color:var(--dim);font-size:14px;margin-top:4px}
#sub .tools{display:flex;gap:6px;align-items:center;margin-top:8px}
.tb{background:#1a1d25;border:1px solid var(--line);border-radius:6px;padding:1px 9px;font-size:13px}
.nx{margin-left:auto;color:var(--dim);font-size:12px;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(2px)}}
.kw{color:#ffd77a;font-weight:600;border-bottom:1px dashed rgba(255,215,122,.5)}
#sub .idle{color:var(--dim);font-size:14px}
#sub .idle b{color:var(--ink);font-weight:600}
#sub .prev{color:var(--dim);font-size:13px;margin-bottom:8px}
.choices{display:grid;gap:7px}
.ch{text-align:left;background:#191c24;border:1px solid #333847;border-radius:8px;padding:8px 11px;display:flex;flex-direction:column}
.ch span{font-size:16px}
.ch small{color:var(--dim);font-size:12.5px}
.ch:active,.ch:hover{border-color:var(--acc)}
#pad{display:grid;grid-template-columns:72px 72px 1fr;gap:8px;flex:none}
#pad button{height:62px;border-radius:12px;background:#171a22;border:1px solid #2c303b;font-size:24px}
#pad button.on{background:#232835}
#bA{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
#bA b{font-size:17px}
#bA small{font-size:11.5px;color:var(--dim)}
#bA.has{border-color:var(--acc);box-shadow:0 0 0 1px rgba(124,242,154,.25) inset}
#modal{position:fixed;inset:0;background:rgba(3,4,8,.82);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.show{display:flex}
.mbox{background:#12141b;border:1px solid #2a2e3a;border-radius:14px;padding:18px;max-width:560px;width:100%;max-height:100%;overflow:auto;-webkit-user-select:text;user-select:text}
.mbox h2{margin:0 0 6px;font-size:20px}
.mbox p{margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{background:#1f2430;border:1px solid #363c4c;border-radius:9px;padding:9px 15px;font-size:15px}
.btn.pri{background:#1f6b45;border-color:#2c8f5d}
.paper{background:#f2ecd9;color:#1b1b1b;border-radius:4px;padding:16px 18px;font-family:"Bradley Hand","Segoe Print","Comic Sans MS","Kaiti SC",cursive;font-size:16px;line-height:1.45;transform:rotate(-.6deg);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.paper h3{margin:0 0 8px;font-size:19px;text-decoration:underline}
.rule{margin:7px 0;cursor:pointer}
.rule .z{display:none;color:#6b665a;font-family:system-ui,"PingFang SC",sans-serif;font-size:13px}
.rule.on .z,.paper.allz .z{display:block}
.rule.red{color:#a5121a;font-family:"Chalkduster","Marker Felt","Segoe Print",cursive;transform:rotate(.8deg) skewX(-5deg);letter-spacing:.3px}
.paper.old{background:#ddd3b6;font-size:15px;transform:rotate(1deg)}
.hint{color:var(--dim);font-size:12.5px;margin-top:10px}
.tasks{list-style:none;padding:0;margin:8px 0}
.tasks li{padding:6px 0;border-bottom:1px solid #22262f;display:flex;gap:9px}
.tasks li.done{color:var(--dim);text-decoration:line-through}
.tasks small{display:block;color:var(--dim);text-decoration:none}
#camc{width:100%;image-rendering:pixelated;border:6px solid #1b1d22;border-radius:8px;background:#000;display:block}
.bar{position:relative;height:34px;background:#1c2029;border-radius:8px;overflow:hidden;margin:14px 0}
.bar .zone{position:absolute;top:0;bottom:0;left:42%;width:16%;background:rgba(124,242,154,.35)}
.bar .mk{position:absolute;top:0;bottom:0;width:4px;background:#fff;left:0}
.bills{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.bill{background:#3a5a3a;border:1px solid #6f9a6a;border-radius:6px;padding:8px 12px;font-family:VT323,monospace;font-size:22px}
.title{font-family:VT323,monospace;font-size:64px;line-height:1;letter-spacing:3px;color:#e9e4d6;text-shadow:0 0 18px rgba(124,242,154,.25)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.gal div{background:#191c24;border:1px solid #2a2e3a;border-radius:8px;padding:8px 10px;font-size:13px}
.gal div b{display:block;font-size:14px}
.gal .lock{color:#555}
.end p.e{font-size:17px;margin:10px 0 0}
.end p.z{color:var(--dim);font-size:13.5px;margin:2px 0 0}
.wl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wl span{background:#1d2129;border:1px solid #2c3140;border-radius:6px;padding:3px 8px;font-size:13px}
.wl span i{font-style:normal;color:var(--dim);margin-left:4px}
.tog{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #22262f}
.sw{width:46px;height:26px;border-radius:13px;background:#333;border:0;position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#bbb;transition:.15s}
.sw.on{background:#1f8a55}.sw.on::after{left:23px;background:#fff}
.fade{animation:fin .5s}
@keyframes fin{from{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div id="clock">22:27</div>
      <div class="hbtns">
        <button class="hb" id="hTask" hidden>任务</button>
        <button class="hb" id="hRule" hidden>守则</button>
        <button class="hb" id="hSet">⚙</button>
      </div>
    </div>
  </div>
  <div id="panel">
    <div id="sub"></div>
    <div id="pad">
      <button id="bL" aria-label="左">◀</button>
      <button id="bR" aria-label="右">▶</button>
      <button id="bA"><b>互动</b><small>Space</small></button>
    </div>
  </div>
</div>
<div id="modal"></div>
<script>
"use strict";
let W=256;const H=160,FLOOR=134;
const $=s=>document.querySelector(s);
const cv=$("#cv"),ctx=cv.getContext("2d");cv.width=W;cv.height=H;
const LS={get(k,d){try{const v=localStorage.getItem("ct_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("ct_"+k,JSON.stringify(v))}catch(e){}}};
const SET=Object.assign({sfx:true,voice:true,zh:false},LS.get("set",{}));
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ================= audio ================= */
let AC=null,master=null,noiseBuf=null;const amb={};
function ac(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=SET.sfx?.9:0;master.connect(AC.destination);initAmb()}catch(e){AC=null}}
  if(AC&&AC.state==="suspended")AC.resume();return AC;
}
function nb(){if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return noiseBuf}
function initAmb(){
  const s=AC.createBufferSource();s.buffer=nb();s.loop=true;const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=1100;const g=AC.createGain();g.gain.value=0;s.connect(f).connect(g).connect(master);s.start();amb.rain=g;
  const o=AC.createOscillator(),o2=AC.createOscillator();o.frequency.value=58;o2.type="triangle";o2.frequency.value=117;const hg=AC.createGain();hg.gain.value=0;o.connect(hg);o2.connect(hg);hg.connect(master);o.start();o2.start();amb.hum=hg;
  const d1=AC.createOscillator(),d2=AC.createOscillator();d1.type=d2.type="sawtooth";d1.frequency.value=41;d2.frequency.value=41.6;const df=AC.createBiquadFilter();df.type="lowpass";df.frequency.value=170;const dg=AC.createGain();dg.gain.value=0;d1.connect(df);d2.connect(df);df.connect(dg).connect(master);d1.start();d2.start();amb.drone=dg;
}
function setAmb(n,v){if(AC&&amb[n])amb[n].gain.setTargetAtTime(v,AC.currentTime,.5)}
function tone(f,d,type="sine",v=.2,t0=0,slide){const t=AC.currentTime+t0,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)}
function noise(d,v=.2,freq=1000,type="lowpass",t0=0,q=1){const t=AC.currentTime+t0,s=AC.createBufferSource();s.buffer=nb();const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(master);s.start(t,Math.random());s.stop(t+d+.05)}
const SFX={
  chime(){tone(1046,.5,"sine",.14);tone(784,.8,"sine",.14,.28)},
  step(){noise(.05,.07,650)},stepOut(){noise(.06,.09,1500,"bandpass")},echo(){noise(.06,.075,420,"lowpass")},
  knock(){[0,.2,.4].forEach(t=>{noise(.12,.55,230,"lowpass",t);tone(85,.12,"sine",.35,t)})},
  ring(){[0,.5].forEach(t=>{tone(440,.42,"square",.045,t);tone(480,.42,"square",.045,t)})},
  beep(){tone(1800,.08,"square",.05)},cash(){tone(1318,.12,"triangle",.12);tone(1760,.25,"triangle",.1,.08);noise(.15,.08,3000,"highpass")},
  hiss(){noise(1.4,.13,2600,"highpass")},pour(){noise(1,.08,600,"bandpass",0,3)},
  box(){noise(.15,.25,400);tone(110,.12,"triangle",.14)},door(){noise(.5,.12,500);tone(150,.4,"triangle",.06,0,90)},
  click(){tone(2400,.03,"square",.04)},sting(){tone(98,1.8,"sawtooth",.1);tone(104,1.8,"sawtooth",.1);tone(1567,1.3,"sine",.035,0,1480)},
  mop(){noise(.3,.12,900,"bandpass",0,2)},ok(){tone(880,.1,"sine",.1);tone(1320,.16,"sine",.1,.08)},bad(){tone(200,.22,"square",.05)},
  sw(){tone(1200,.02,"square",.1);noise(.05,.2,2000)},tap(){noise(.05,.3,1600,"bandpass",0,4);noise(.05,.3,1600,"bandpass",.18,4)},
  lock(){tone(600,.05,"square",.07);tone(300,.08,"square",.07,.07)},car(){noise(2.4,.13,450)},thud(){tone(70,.3,"sine",.4);noise(.12,.2,300)},
  buzz(){noise(.25,.06,120,"lowpass")}
};
function sfx(n){if(!SET.sfx||!ac())return;try{SFX[n]()}catch(e){}}

/* ================= speech ================= */
const tts=window.speechSynthesis;
const NOVELTY=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Junior|Ralph|Kathy|Fred|Princess|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
function speak(text,pitch=1,rate=.92,vi=0){
  if(!tts)return;try{tts.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[*_"“”]/g,""));u.lang="en-US";u.rate=rate;u.pitch=pitch;
  const vs=tts.getVoices().filter(v=>/^en[-_]US/i.test(v.lang)&&!NOVELTY.test(v.name));if(vs.length)u.voice=vs[vi%vs.length];tts.speak(u)}catch(e){}
}
if(tts&&tts.onvoiceschanged!==undefined)tts.onvoiceschanged=()=>{};

/* ================= pixel font & draw helpers ================= */
const FONT={A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",E:"111100110100111",F:"111100110100100",G:"011100101101011",H:"101101111101101",I:"111010010010111",J:"001001001101010",K:"101101110101101",L:"100100100100111",M:"101111111101101",N:"110101101101101",O:"010101101101010",P:"110101110100100",Q:"010101101110011",R:"110101110101101",S:"011100010001110",T:"111010010010010",U:"101101101101111",V:"101101101101010",W:"101101111111101",X:"101101010101101",Y:"101101010010010",Z:"111001010100111",
"0":"111101101101111","1":"010110010010111","2":"110001010100111","3":"110001010001110","4":"101101111001001","5":"111100110001110","6":"011100111101111","7":"111001010010010","8":"111101111101111","9":"111101111001110",":":"000010000010000",".":"000000000000010","-":"000000111000000","/":"001001010100100","$":"011110010011110","!":"010010010000010","?":"110001010000010"," ":"000000000000000"};
let g=ctx,CX=0;
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x-CX),Math.round(y),w,h)}
function T(s,x,y,c){s=String(s).toUpperCase();g.fillStyle=c;let px=Math.round(x-CX);for(const ch of s){const f=FONT[ch];if(f)for(let i=0;i<15;i++)if(f[i]==="1")g.fillRect(px+i%3,y+(i/3|0),1,1);px+=4}}
function srand(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function ell(x,y,rx,ry,c){g.fillStyle=c;g.beginPath();g.ellipse(Math.round(x-CX),y,rx,ry,0,0,7);g.fill()}

/* ================= characters ================= */
const LOOK={
  mia:{skin:"#e8c3a0",hair:"#1d1517",top:"#e9e6de",vest:"#2f8a5a",pants:"#23262c",shoes:"#111",pony:1,tag:1},
  tom:{skin:"#d9b08c",hair:"#2b2420",top:"#4a505c",tie:"#a33",pants:"#3a3f4a",shoes:"#111"},
  lily:{skin:"#f0cfb0",hair:"#5a3a2a",top:"#8a5bbf",pants:"#3b4f7a",shoes:"#ddd",phones:1},
  rain:{skin:"#0c0c0e",hair:"#0c0c0e",coat:"#e3be38",pants:"#2b2b2b",shoes:"#1a1a1a",hood:1},
  grace:{skin:"#c99a78",hair:"#3a241a",top:"#5fa8a0",pants:"#5fa8a0",shoes:"#eee",bun:1,cardi:"#c9b9a0"},
  thing:{skin:"#d3dad5",hair:"#d3dad5",top:"#e9e6de",vest:"#2f8a5a",pants:"#23262c",shoes:"#111",tall:1,faceless:1,tag:1}
};
function person(x,y,L,face=1,step=0,alpha=1){
  x=Math.round(x);const ga=g.globalAlpha;g.globalAlpha=alpha;
  const tall=L.tall?1:0,legH=8+tall*4,torH=10+tall*4,top=y-legH-torH-7;
  const P=(dx,dy,w,h,c)=>R(face>0?x+dx:x-dx-w,dy,w,h,c);
  const a=step%2?1:0;
  P(-3+a,y-legH,2,legH,L.pants);P(1-a,y-legH,2,legH,L.pants);
  P(-3+a,y-1,3,1,L.shoes);P(1-a,y-1,3,1,L.shoes);
  const ty=y-legH-torH;
  if(L.coat){P(-5,ty-1,10,torH+legH-2,L.coat);P(-5,ty+torH+legH-4,10,1,"#b8962a");}
  else{P(-4,ty,8,torH,L.top);if(L.vest){P(-4,ty,3,torH,L.vest);P(1,ty,3,torH,L.vest)}if(L.tie)P(0,ty+1,1,5,L.tie);if(L.cardi){P(-4,ty,2,torH,L.cardi);P(2,ty,2,torH,L.cardi)}if(L.tag)P(1,ty+2,2,1,"#f4f1e6")}
  const armL=L.tall?torH+5:8;P(2,ty+1+(step%2),2,armL,L.coat||L.vest||L.cardi||L.top);P(2,ty+armL+(step%2),2,1,L.skin);
  const hy=top;
  if(L.hood){P(-4,hy-2,8,9,L.coat);P(0,hy+1,3,5,"#0b0b0d");}
  else{
    const hx=L.tall?1:0;P(-3+hx,hy,6,7,L.skin);P(-3+hx,hy,6,2,L.hair);P(-3+hx,hy,2,5,L.hair);
    if(L.pony)P(-5,hy+1,2,4,L.hair);if(L.bun)P(-5,hy,2,3,L.hair);if(L.phones){P(-3,hy-1,6,1,"#111");P(-1,hy+2,2,3,"#111")}
    if(L.faceless){P(1+hx,hy+3,2,2,"#2a2f2c");P(-1+hx,hy+3,1,2,"#2a2f2c")}else P(1+hx,hy+3,1,1,"#1a1a1a");
  }
  g.globalAlpha=ga;
}

/* ================= words ================= */
const WORDS={"night shift":"夜班","clock in":"打卡上班","clocked in":"已打卡","restock":"补货","shelf":"货架","register":"收银机","spicy":"辣的","keep the change":"零钱不用找了","exact change":"正好的零钱","regular":"常客","raincoat":"雨衣","rules":"规则","camera":"监控","knocking":"敲门","lock":"锁","mop":"拖（地）","trash":"垃圾","brew":"煮（咖啡）","black":"（咖啡）不加奶不加糖","on me":"我请客","dripping":"滴水","fridge":"冰柜","nervous":"紧张的","obvious":"明显的","back door":"后门","front door":"前门","no sugar":"无糖","alley":"小巷","underpass":"地下通道","main road":"大路","name tag":"名牌","medium":"中杯","slowly":"慢慢地","creepy":"吓人的","footsteps":"脚步声","handprint":"手印","fresh":"新鲜的","relieved":"松了口气","blink":"眨眼","shortcut":"近路","exhausted":"筋疲力尽","manager":"店长","midnight":"午夜"};
const WKEYS=Object.keys(WORDS).sort((a,b)=>b.length-a.length);
const WRE=new RegExp("\\b("+WKEYS.map(k=>k.replace(/ /g,"\\s")).join("|")+")\\b","gi");
function markWords(en){const esc=en.replace(/&/g,"&amp;").replace(/</g,"&lt;");return esc.replace(WRE,m=>{const k=m.toLowerCase();if(G)G.words.add(k);return`<span class="kw" title="${WORDS[k]}">${m}</span>`})}

/* ================= state ================= */
let G=null;
function newGame(){
  G={scene:"street0",px:24,face:1,walkT:0,stepN:0,carry:null,busy:false,over:false,paused:true,q:[],timers:[],t:0,
    clock:22*60+26,cap:22*60+29,ph:-1,phT:0,T:{clock:false,noodles:false,drinks:false,coffee:false,mop:false,trash:false,register:false,lights:false},
    F:{},spawned:{},npcs:[],order:null,pot:0,puddle:3,backOpen:false,lightsOn:true,flick:{},outsideFig:null,knocking:false,ringing:false,
    noodle:["rr00y0","0b000r","y00b00"].map(s=>s.split("")),fridge:["g0m0c0","0h00g0","m0y00c"].map(s=>s.split("")),
    snack:null,words:new Set(),route:null,beats:{},shadowT:0,fade:1,fadeTo:0,lights:[],readRules:false,redRules:false,camView:"front",
    echoLeft:0,echoT:0,lastStep:0,followed:false,companion:null};
}
const after=(s,fn)=>G.timers.push({t:G.t+s,fn});
const queue=fn=>G.q.push(fn);

    if(sv){await say("kevin","Keep walking, Mia. Don't look back.","继续走，Mia。别回头。");await say("kevin","I'll stay here.","我留在这儿。");setAmb("drone",0);sfx("thud");await say("think","The footsteps behind me... stop. And don't start again.","我身后的脚步声……停了。再也没有响起。")}
    else await say("kevin","Good night, Mia. Get home safe.","晚安，Mia。安全到家。");
    G.kevin.fade=1})}
  if(G.followed&&!b.s&&G.px>w*.68){b.s=1;G.shadowT=1.6;sfx("sting");queue(()=>say("think","Don't look back. Just walk.","别回头。往前走就好。"))}
}
async function arriveHome(){
  sfx("door");await wait(300);sfx("lock");
  const F=G.F;let id;
  if(G.followed)id="followed";
  else{const miss=["noodles","drinks","coffee","mop","trash","register"].filter(k=>!G.T[k]).length;
    if(miss>=2)id="fired";else if(F.polite&&!F.ignoredWin&&F.nurse&&F.oldNote&&miss===0)id="true";else id="good"}
  return ending(id);
}

 true:{t:"The Night Regular",z:"夜里的常客",L:[["The next night, Mr. Park is waiting at the counter.","第二天晚上，朴店长在柜台后面等你。"],["You tell him about the man in the yellow raincoat.","你跟他说起那个穿黄雨衣的男人。"],["His face goes white.","他的脸一下子白了。"],["\"Kevin worked nights before you. He loved that ugly yellow raincoat.\"","“你之前上夜班的是 Kevin。他特别喜欢那件难看的黄雨衣。”"],["\"One night last winter, he didn't come to work. Nobody has seen him since.\"","“去年冬天有一天晚上，他没来上班。之后再也没人见过他。”"],["You check last night's camera. At 11:40 p.m., the door opens by itself.","你翻看昨晚的监控。晚上 11:40，门自己开了。"],["Nobody comes in. But on the counter, there is exact change for a bottle of milk.","没有人进来。可柜台上，放着正好够买一瓶牛奶的零钱。"]]},

const REASON={alley:["\"Thanks for walking me home. You took the short way.\"","“谢谢你带我回家。你走了近路。”"],unlocked:["\"Thanks for leaving the door open for me.\"","“谢谢你给我留了门。”"],back:["\"Thanks for opening the back door for me.\"","“谢谢你给我开了后门。”"],cold:["\"The coffee was cold. So I followed you home.\"","“咖啡凉了。所以我跟你回了家。”"]};
const ORDER=["good","true","front","back","followed","fired"];
async function ending(id){
  G.over=true;G.busy=true;advanceFn=null;setAmb("drone",id==="good"||id==="true"?0:.1);
  if(id==="front"||id==="back"){sfx("door");G.lightsOn=false;await wait(500);sfx("sting");G.fadeTo=1;await wait(1400)}else{G.fadeTo=1;await wait(900)}
  const got=LS.get("end",[]);if(!got.includes(id)){got.push(id);LS.set("end",got)}
  const e=END[id];let L=e.L.map(l=>l[0]==="@reason"?REASON[(G.reasons&&G.reasons[0])||"alley"]:l);
  const words=[...G.words].slice(0,24);
  SUB.innerHTML="";setAmb("rain",0);setAmb("hum",0);
  await modal(`<div class="end"><p style="color:var(--dim);margin:0">ENDING ${ORDER.indexOf(id)+1} / 6</p><h2 style="font-family:VT323,monospace;font-size:34px;font-weight:400;margin:2px 0">${e.t}</h2><p style="color:var(--dim);margin-top:0">${e.z}</p>
    ${L.map(l=>`<p class="e">${l[0]}</p><p class="z">${l[1]}</p>`).join("")}
    <h3 style="margin:18px 0 0;font-size:15px">今晚遇到的词</h3><div class="wl">${words.map(w=>`<span>${w}<i>${WORDS[w]}</i></span>`).join("")||"<span>—</span>"}</div>
    <p class="hint">已解锁结局：${got.length} / 6。不同的选择会走向不同的结局。</p>
    <div class="row"><button class="btn pri" data-close="again">再上一次夜班</button><button class="btn" data-close="title">回标题</button></div></div>`).then(v=>{newGame();if(v==="again")startGame();else title()});
}

/* ================= scenes ================= */
async function goScene(sc,x){G.fadeTo=1;await wait(450);G.scene=sc;G.px=x;G.face=1;G.npcs=G.scene==="store"?G.npcs:[];G.CX=clampCam();G.fadeTo=0;
  setAmb("rain",sc==="store"?.05:sc==="under"?.03:.13);setAmb("hum",sc==="store"&&G.lightsOn?.05:0);await wait(300)}
function clampCam(){const w=SC[G.scene].w;return Math.max(0,Math.min(w-W,G.px-W/2))}

/* ================= loop ================= */
const keys={l:0,r:0};
function update(dt){
  G.t+=dt;G.dt=dt;
  for(const k in G.flick)G.flick[k]-=dt;
  if(Math.random()<dt*(G.clock>=1440?.25:.06)){const fl=G.scene==="store"?[40,150,250,350,450]:G.scene==="under"?[60,140,220,300,380,460]:G.scene==="alley"?[240]:[];if(fl.length){const x=fl[Math.random()*fl.length|0];G.flick[x]=.05+Math.random()*.25;if(x===40||G.clock>=1440)G.flick[x]+=.1}}
  const free=!G.busy&&!G.modalOpen&&!G.paused&&!G.over;
  const dir=free?(keys.r-keys.l):0;
  if(dir){const sp=(G.carry&&G.carry.kind&&G.carry.kind.startsWith("box"))?34:50;G.px+=dir*sp*dt;G.face=dir;G.walkT+=dt;const w=SC[G.scene].w;G.px=Math.max(8,Math.min(w-8,G.px));
    G.idleT=0;if(G.walkT-G.lastStep>.3){G.lastStep=G.walkT;G.stepN++;sfx(G.scene==="store"?"step":"stepOut");if(G.followed){G.echoLeft=2;after(.22,()=>{if(G.followed)sfx("echo")})}}}
  else if(G.followed&&G.echoLeft>0){G.idleT=(G.idleT||0)+dt;if(G.idleT>.45){G.idleT=0;G.echoLeft--;sfx("echo")}}
  const tc=clampCam();G.CX=G.CX==null?tc:G.CX+(tc-G.CX)*Math.min(1,dt*6);
  for(const n of G.npcs){const d=n.tx-n.x;if(Math.abs(d)>1){n.x+=Math.sign(d)*Math.min(Math.abs(d),32*dt);n.face=Math.sign(d);n.wt+=dt;n.step=(n.wt*3.3|0)}else if(n.stage==="in"){n.stage="order";n.face=-1}
    if(n.stage==="leave"&&Math.abs(n.tx-n.x)<=1){n.stage="gone";sfx("chime")}}
  G.npcs=G.npcs.filter(n=>n.stage!=="gone");
  for(let i=G.timers.length-1;i>=0;i--)if(G.t>=G.timers[i].t){const f=G.timers[i].fn;G.timers.splice(i,1);f()}
  if(G.scene==="store"&&!G.over){
    if(!G.paused&&!G.modalOpen)G.clock=Math.min(G.cap,G.clock+dt/3);G.phT+=dt;
    if(!G.F.mid&&G.clock>=1440)midnight();
    const p=PH[G.ph];p&&p.up&&p.up();
  }else if(G.scene!=="street0"&&G.scene!=="store")G.clock+=dt/6;
  if(["main","under","alley"].includes(G.scene))routeUpdate();
  if(G.shadowT>0)G.shadowT-=dt;
  if(G.kevin&&G.kevin.fade){G.kevin.a-=dt*.5;if(G.kevin.a<=0)G.kevin=null}
  if(G.eyesT==null)G.eyesT=0;
  G.fade+=(G.fadeTo-G.fade)*Math.min(1,dt*5);
  if(!G.busy&&!G.modalOpen&&G.q.length&&!G.over&&!G.paused)run(G.q.shift());
  if(G.scene==="street0"&&!G.F.intro&&!G.paused){G.F.intro=1;queue(async()=>{await say("think","10:27 p.m. Rain again.","晚上十点二十七。又下雨了。");await say("think","My first night shift alone. It's just a store. I can do this.","第一次一个人上夜班。只是个便利店而已，我可以的。")})}
  updateUI();
}
let lastBtn="";
function updateUI(){
  $("#clock").textContent=hhmm(G.clock);
  const n=(!G.busy&&!G.modalOpen)?nearest():null;
  let h=advanceFn?"<b>继续</b><small>Next</small>":G.choosing?"<b>请选择</b><small>Choose</small>":n?(n.npc?"<b>说话</b><small>Talk</small>":`<b>${n.l[0]}</b><small>${n.l[1]}</small>`):"<b>互动</b><small>Space</small>";
  if(h!==lastBtn){lastBtn=h;const b=$("#bA");b.innerHTML=h;b.classList.toggle("has",!!n||!!advanceFn)}
  G.prompt=n;
}
function draw(){
  g=ctx;CX=Math.round(G.CX||0);G.lights=[];
  SC[G.scene].draw();
  for(const n of G.npcs)person(n.x,FLOOR,n.def.look,n.face,n.step);
  if(G.kevin){person(G.kevin.x,FLOOR,LOOK.rain,-1,0,Math.max(0,G.kevin.a))}
  if(G.F.eyes&&G.scene==="store"&&!G.lightsOn){R(92,FLOOR-30,1,1,"#e8f0e8");R(95,FLOOR-30,1,1,"#e8f0e8")}
  person(G.px,FLOOR,LOOK.mia,G.face,(G.walkT*3.3|0));
  const c=G.carry;
  if(c){const x=G.px,y=FLOOR;if(c.kind==="boxN"||c.kind==="boxD"){R(x-6,y-24,12,9,"#a57c4c");R(x-6,y-20,12,1,"#c9a77a")}else if(c.kind==="trash")R(x+(G.face>0?3:-9),y-12,6,8,"#111");else if(c.kind==="mop"){for(let i=0;i<14;i++)R(x+G.face*(3+i/2),y-22+i*1.4,1,2,"#9a7b52");R(x+G.face*10-2,y-3,5,3,"#ddd")}else R(x+(G.face>0?3:-6),y-14,3,4,c.id==="spicy"?"#d23b2f":c.id==="g"?"#7ccf7a":c.id==="m"?"#f2f2ea":"#c9b28a")}
  const dark=G.scene==="store"?(G.lightsOn?(G.clock>=1440?.58:.48):.9):SC[G.scene].dark;
  if(G.scene==="store"&&G.lightsOn)G.lights.push({x:G.px,y:FLOOR-14,r:30,i:.3});
  if(G.scene!=="store")G.lights.push({x:G.px,y:FLOOR-14,r:18,i:.35});
  lighting(dark);
  if(G.shadowT>0){g=ctx;CX=0;const a=Math.min(1,G.shadowT)*.85;person(10,FLOOR,{skin:"#050607",hair:"#050607",top:"#050607",pants:"#050607",shoes:"#050607",tall:1,faceless:1},1,0,a);CX=Math.round(G.CX||0)}
  g=ctx;CX=Math.round(G.CX||0);for(const n of G.npcs)if(n.stage==="order"||n.stage==="wait"){const b=Math.sin(G.t*5)>0?1:0,y=FLOOR-37-b;R(n.x-3,y,7,9,"#111");R(n.x-2,y+1,5,7,n.stage==="order"?"#ffd77a":"#cfcfcf");if(n.stage==="order"){R(n.x,y+2,1,3,"#111");R(n.x,y+6,1,1,"#111")}else{R(n.x-1,y+4,1,1,"#111");R(n.x+1,y+4,1,1,"#111")}}
  if(G.prompt&&!G.busy){const x=G.prompt.npc?G.prompt.npc.x:G.prompt.o.x,b=(G.t*4|0)%2;g=ctx;R(x-2,FLOOR-44-b,5,1,"#7cf29a");R(x-1,FLOOR-43-b,3,1,"#7cf29a");R(x,FLOOR-42-b,1,1,"#7cf29a")}
  if(G.fade>.01){ctx.fillStyle=`rgba(0,0,0,${G.fade})`;ctx.fillRect(0,0,W,H)}
}
let lastT=0;
function frame(ts){const dt=Math.min(.05,(ts-lastT)/1000||0);lastT=ts;if(G){if(!G.over)update(dt);else{G.t+=dt;G.fade+=(G.fadeTo-G.fade)*Math.min(1,dt*4)}draw()}requestAnimationFrame(frame)}

/* ================= input & layout ================= */
function hold(el,k){const on=e=>{e.preventDefault();ac();keys[k]=1;el.classList.add("on")},off=e=>{keys[k]=0;el.classList.remove("on")};el.addEventListener("pointerdown",on);el.addEventListener("pointerup",off);el.addEventListener("pointerleave",off);el.addEventListener("pointercancel",off);el.addEventListener("contextmenu",e=>e.preventDefault())}
hold($("#bL"),"l");hold($("#bR"),"r");
$("#bA").addEventListener("click",()=>{if(G&&G.choosing)return;interact()});
addEventListener("keydown",e=>{
  if(MOD.classList.contains("show"))return;
  if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")keys.l=1;
  else if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")keys.r=1;
  else if(e.key===" "||e.key==="Enter"||e.key==="e"||e.key==="E"){e.preventDefault();if(!G||!G.choosing)interact()}
  else if(/^[1-4]$/.test(e.key)&&G&&G.choosing&&G.chOpts[+e.key-1])G.choosing(G.chOpts[+e.key-1][2]);
});
addEventListener("keyup",e=>{if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")keys.l=0;if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")keys.r=0});
addEventListener("blur",()=>{keys.l=keys.r=0});
$("#hTask").onclick=()=>{if(G&&!G.modalOpen)showTasks()};
$("#hRule").onclick=()=>{if(G&&!G.busy&&!G.modalOpen)run(readRules)};
$("#hSet").onclick=()=>settings();
function settings(){
  const row=(k,t)=>`<div class="tog"><span>${t}</span><button class="sw ${SET[k]?"on":""}" data-k="${k}"></button></div>`;
  return modal(`<h2>设置</h2>${row("sfx","音效和环境声")}${row("voice","自动朗读台词（英文）")}${row("zh","字幕默认显示中文")}<p class="hint">朗读用的是你设备自带的英文语音，不同手机声音不一样。</p><div class="row"><button class="btn pri" data-close>好</button></div>`,m=>{
    m.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{const k=b.dataset.k;SET[k]=!SET[k];b.classList.toggle("on",SET[k]);LS.set("set",SET);if(k==="sfx"&&master)master.gain.value=SET.sfx?.9:0;if(k==="voice"&&!SET.voice&&tts)tts.cancel()});
  });
}
function layout(){
  const vw=innerWidth,vh=innerHeight,land=vw>vh*1.2&&vh<640;document.body.classList.toggle("land",land);
  const nw=(!land&&vw<vh)?Math.max(168,Math.min(256,Math.round(H*vw/(vh*.48)))):256;
  if(nw!==W){W=nw;cv.width=W;LC.width=W;if(G)G.CX=null}
  const aw=land?vw-350:vw,ah=land?vh-12:vh-250;let s=Math.max(1,Math.min(aw/W,ah/H));if(s>=3)s=Math.floor(s);
  const st=$("#stage");st.style.width=Math.floor(W*s)+"px";st.style.height=Math.floor(H*s)+"px";
}
addEventListener("resize",layout);layout();

/* ================= title ================= */

  modal(`<div style="text-align:center"><div class="title">CLOSING TIME</div><p style="color:var(--dim);margin:6px 0 2px">便利店夜班 · 微恐 · 英文字幕</p></div>
  <p style="margin-top:14px">你是 Mia，今晚第一次一个人在街角便利店值夜班。22:30 打卡，凌晨 1 点锁门回家。</p>
  <p class="hint">◀ ▶ 移动，「互动」按钮（或空格）和物品、客人互动。字幕点「中文」看翻译，点「听」朗读。建议戴耳机。</p>
  <div class="gal">${ORDER.map((id,i)=>got.includes(id)?`<div><b>${END[id].t}</b>${END[id].z}</div>`:`<div class="lock"><b>???</b>结局 ${i+1}</div>`).join("")}</div>
  <div class="row"><button class="btn pri" data-close="go" style="flex:1;font-size:17px">开始上班</button><button class="btn" id="tset">设置</button></div>

}
function startGame(){ac();G.paused=false;G.fadeTo=0;setAmb("rain",.13);showIdle()}
newGame();G.fade=1;G.fadeTo=.35;requestAnimationFrame(frame);title();
