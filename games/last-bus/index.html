<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Last Bus</title>
<link rel="stylesheet" href="https://fonts.googleapis.cn/css2?family=Special+Elite&display=swap" media="print" onload="this.media='all'">
<style>
:root{--ink:#e9e7e1;--dim:#8a8984;--line:#2a2a2c;--panel:#0f0f10;--red:#d2342c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050506;color:var(--ink);font:15px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center}
body.land #app{flex-direction:row;justify-content:center;gap:10px}
#stage{position:relative;flex:none;background:#000;overflow:hidden}
#cv{display:block;width:100%;height:100%}
#hud{position:absolute;inset:8px 8px auto 8px;display:flex;justify-content:space-between;pointer-events:none;font-family:"Special Elite",Georgia,serif}
#hud .t{background:rgba(0,0,0,.55);border-radius:4px;padding:1px 8px;font-size:15px;letter-spacing:1px}
#hud button{pointer-events:auto;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:0 9px;font-size:13px;line-height:22px}
#panel{flex:1;width:100%;max-width:760px;display:flex;flex-direction:column;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));min-height:0}
body.land #panel{width:330px;flex:none;max-width:none;height:100%;justify-content:flex-end;padding:10px 10px calc(10px + env(safe-area-inset-bottom)) 0}
#sub{flex:1;min-height:92px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:auto;cursor:pointer}
#sub .who{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.5px}
#sub .en{font-family:"Special Elite",Georgia,serif;font-size:18px;line-height:1.45}
#sub .zh{color:var(--dim);font-size:14px;margin-top:3px}
#sub .tools{display:flex;gap:6px;margin-top:8px;align-items:center}
.tb{background:#1a1a1c;border:1px solid var(--line);border-radius:6px;padding:1px 9px;font-size:13px}
.nx{margin-left:auto;color:var(--dim);font-size:12px}
.idle{color:var(--dim);font-size:14px}
.kw{border-bottom:1px dashed rgba(255,255,255,.45)}
.choices{display:grid;gap:7px;margin-top:8px}
.ch{text-align:left;background:#18181a;border:1px solid #333;border-radius:8px;padding:8px 11px}
.ch small{display:block;color:var(--dim);font-size:12.5px}
#pad{display:grid;grid-template-columns:76px 76px 1fr 1fr;gap:8px;flex:none}
#pad button{height:62px;border-radius:12px;background:#141416;border:1px solid #2c2c30;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
#pad button small{font-size:11.5px;color:var(--dim)}
#pad button.on{background:#222226}
#pad .dot{position:relative}#pad .dot::after{content:"";position:absolute;top:8px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--red)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.84);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.show{display:flex}
.mbox{background:#121214;border:1px solid #2c2c30;border-radius:14px;padding:18px;max-width:540px;width:100%;max-height:100%;overflow:auto}
.mbox h2{margin:0 0 6px;font-size:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{background:#1e1e22;border:1px solid #38383e;border-radius:9px;padding:9px 15px}
.btn.pri{background:#e9e7e1;color:#111;border-color:#e9e7e1}
.hint{color:var(--dim);font-size:12.5px}
.title{font-family:"Special Elite",Georgia,serif;font-size:58px;line-height:1;letter-spacing:2px}
.close{background:#e8e6df;color:#111;border-radius:6px;padding:16px;font-family:"Special Elite",Georgia,serif;font-size:22px;line-height:1.4;text-align:center}
.close .zh{font-family:system-ui,"PingFang SC",sans-serif;font-size:14px;color:#555;margin-top:8px;display:none}
.close.z .zh{display:block}
.msg{background:#1a1a1d;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14.5px}
.msg b{font-size:12px;color:var(--dim);display:block}
.msg small{color:var(--dim);display:block}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.gal div{background:#18181a;border:1px solid #2a2a2e;border-radius:8px;padding:8px 10px;font-size:13px}
.gal b{display:block}.gal .lock{color:#555}
.end p.e{font-family:"Special Elite",Georgia,serif;font-size:17px;margin:10px 0 0}
.end p.z{color:var(--dim);font-size:13.5px;margin:2px 0 0}
.tog{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #222}
.sw{width:46px;height:26px;border-radius:13px;background:#333;border:0;position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#bbb;transition:.15s}
.sw.on{background:#e9e7e1}.sw.on::after{left:23px;background:#111}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="cv"></canvas>
    <div id="hud"><span class="t" id="clk">23:21</span><span><span class="t" id="bat">🔋18%</span> <button id="hSet">⚙</button></span></div>
  </div>
  <div id="panel">
    <div id="sub"></div>
    <div id="pad">
      <button id="bL">◀</button><button id="bR">▶</button>
      <button id="bLook">🔍<small>看近一点</small></button>
      <button id="bPh">📱<small>手机</small></button>
    </div>
  </div>
</div>
<div id="modal"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const cv=$("#cv"),ctx=cv.getContext("2d");
const VH=360,GY=300,LEN=900;let VW=640,SC=1;
const LS={get(k,d){try{const v=localStorage.getItem("lb_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("lb_"+k,JSON.stringify(v))}catch(e){}}};
const SET=Object.assign({sfx:true,voice:true,zh:false},LS.get("set",{}));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=a=>a[Math.random()*a.length|0];

/* ===== audio ===== */
let AC=null,master=null,NB=null;const amb={};
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=SET.sfx?.9:0;master.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=1300;const gn=AC.createGain();gn.gain.value=0;s.connect(f).connect(gn).connect(master);s.start();amb.rain=gn;
  const o=AC.createOscillator(),o2=AC.createOscillator();o.type=o2.type="sawtooth";o.frequency.value=48;o2.frequency.value=48.7;const lf=AC.createBiquadFilter();lf.type="lowpass";lf.frequency.value=150;const dg=AC.createGain();dg.gain.value=0;o.connect(lf);o2.connect(lf);lf.connect(dg).connect(master);o.start();o2.start();amb.drone=dg;
 }catch(e){AC=null}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function setAmb(n,v){if(AC&&amb[n])amb[n].gain.setTargetAtTime(v,AC.currentTime,.6)}
function tone(f,d,type="sine",v=.2,t0=0,sl){const t=AC.currentTime+t0,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)}
function noise(d,v=.2,fr=1000,type="lowpass",t0=0,q=1){const t=AC.currentTime+t0,s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=fr;f.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(master);s.start(t,Math.random());s.stop(t+d+.05)}
const SFX={step(){noise(.06,.09,700,"bandpass",0,1.5)},echo(){noise(.08,.07,380,"bandpass",0,2)},buzz(){[0,.25].forEach(t=>noise(.18,.12,160,"lowpass",t))},sting(){tone(92,1.8,"sawtooth",.09);tone(97,1.8,"sawtooth",.09);tone(1480,1.2,"sine",.03,0,1390)},ok(){tone(660,.3,"sine",.06);tone(990,.4,"sine",.05,.12)},bad(){tone(140,.8,"triangle",.12,0,90)},bus(){noise(3,.16,220);tone(55,3,"sawtooth",.05)},door(){noise(.6,.12,900,"bandpass",0,3)},click(){tone(2200,.03,"square",.03)}};
function sfx(n){if(!SET.sfx||!ac())return;try{SFX[n]()}catch(e){}}
const tts=window.speechSynthesis,NOV=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Junior|Ralph|Kathy|Fred|Princess|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
function speak(t,p=1,r=.9){if(!tts||!SET.voice)return;try{tts.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[*"“”]/g,""));u.lang="en-US";u.rate=r;u.pitch=p;const vs=tts.getVoices().filter(v=>/^en[-_]US/i.test(v.lang)&&!NOV.test(v.name));if(vs.length)u.voice=vs[0];tts.speak(u)}catch(e){}}

/* ===== words ===== */
const WORDS={"missing":"失踪","last seen":"最后一次被看到","timetable":"时刻表","block":"街区","blocks":"街区","bus stop":"公交站","weird":"奇怪的","location":"位置","circles":"圆圈；兜圈子","behind":"在……后面","footsteps":"脚步声","turn back":"往回走","shadow":"影子","alone":"独自","picking up":"接电话","forever":"永远","drop":"掉落","dropped":"掉了","slow":"慢行","headline":"标题","vending machine":"自动售货机","wrong":"不对的","again":"又；再","driver":"司机","passengers":"乘客","street":"街道"};
const WRE=new RegExp("\\b("+Object.keys(WORDS).sort((a,b)=>b.length-a.length).map(k=>k.replace(/ /g,"\\s")).join("|")+")\\b","gi");
const mark=en=>en.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(WRE,m=>`<span class="kw" title="${WORDS[m.toLowerCase()]}">${m}</span>`);

/* ===== anomalies ===== */
const AN={
 street:["The street sign said \"Elm Streat\". That's not how you spell it.","路牌上写的是“Elm Streat”。拼写不对。"],
 time:["The timetable said the last bus is at 23:04, not 23:40.","时刻表上写末班车是 23:04，不是 23:40。"],
 poster:["The poster said: \"Last seen: behind you.\"","海报上写着：“最后一次被看到：在你身后。”"],
 eyes:["The face on the poster... its eyes were following me.","海报上那张脸……眼睛一直在跟着我转。"],
 lamp5:["There were five street lamps. There are always four.","路灯有五盏。明明一直都是四盏。"],
 lampred:["One street lamp was red.","有一盏路灯是红色的。"],
 steps:["When I stopped walking, the footsteps didn't stop.","我停下来的时候，脚步声没有停。"],
 shadow:["My shadow was on the wrong side. And it was late.","我的影子在反方向，而且慢了半拍。"],
 open:["The shop sign said OPEN 25H. There are only 24 hours in a day.","店门口写着 OPEN 25H。一天只有 24 小时。"],
 news:["The newspaper headline said: WOMAN WALKS SAME STREET FOREVER.","报纸标题写着：女子永远走在同一条街上。"],
 bench:["The man on the bench was gone. Only his newspaper was there.","长椅上的男人不见了，只剩下他的报纸。"],
 vend:["The vending machine buttons spelled H-E-L-P.","自动售货机的按钮拼出了 H-E-L-P。"],
 sign:["The road sign said: SLOW, CHILDREN WATCHING.","路牌写着：慢行，孩子们在看着。"],
 moon:["There were two moons.","天上有两个月亮。"],
 window:["Someone was standing in every window.","每一扇窗户里都站着一个人。"],
 rainup:["The rain was falling up.","雨在往上落。"],
 car:["Someone was sitting in the parked car. Lights on. Watching.","停着的车里坐着人。车灯开着。在看。"],
 cat:["The cat was standing on two legs.","那只猫是用两条腿站着的。"],
 phone:["I got a text from an unknown number: \"you dropped something. come back.\"","我收到一条陌生号码的短信：“你掉东西了。回来。”"]
};
const AKEYS=Object.keys(AN);
const STORY={1:["Jess","Did you make the last bus? N8 at 23:40, to Maple Ave. Don't miss it lol","赶上末班车了吗？N8，23:40，开往 Maple Ave。别错过了哈哈"],3:["Jess","btw don't walk down Elm St alone. That woman who went missing last month? Anna something. They never found her.","对了，别一个人走 Elm 街。上个月失踪的那个女的？叫 Anna 什么的。一直没找到。"],5:["Jess","hey your location is weird. The map says you're walking in circles??","喂，你的位置好奇怪。地图上显示你在兜圈子？？"],7:["Jess","Call me when you're on the bus ok","上车了给我打电话，好吗"],10:["Jess","I'm calling you. Why aren't you picking up","我在给你打电话。你怎么不接"],13:["Jess","it says you're on Elm St. It has said that for an hour.","上面显示你在 Elm 街。已经显示一个小时了。"],17:["Jess","please just keep walking. don't look back","求你了，一直走。别回头"]};

/* ===== state ===== */
let G=null;
function newGame(){G={x:90,face:1,walk:0,count:0,mist:0,loop:0,an:null,last:[],t:0,still:0,echoN:0,bat:18,min:23*60+21,msgs:[],unread:0,phoneDone:false,keys:{},busy:false,over:false,mode:"walk",cap:null,bus:null,busFake:null,ph:0,sh:0}}
function pickAn(){
  if(G.loop===0)return null;
  if(Math.random()>.58)return null;
  let pool=AKEYS.filter(k=>!G.last.includes(k));const k=rnd(pool);G.last.push(k);if(G.last.length>8)G.last.shift();return k;
}

/* ===== captions ===== */
const SUB=$("#sub");let adv=null,lastLine=null;
function lineHTML(who,en,zh,tap){return`${who?`<div class="who">${who}</div>`:""}<div class="en">${mark(en)}</div><div class="zh"${SET.zh?"":" hidden"}>${zh}</div><div class="tools"><button class="tb" data-a="spk">🔊 听</button><button class="tb" data-a="zh">中文</button>${tap?'<span class="nx">点击继续 ▼</span>':""}</div>`}
function cap(en,zh,who=""){lastLine=en;SUB.innerHTML=lineHTML(who,en,zh,false);speak(en,1.05,.92)}
function say(en,zh,who=""){return new Promise(r=>{lastLine=en;SUB.innerHTML=lineHTML(who,en,zh,true);speak(en,1.05,.92);adv=()=>{adv=null;r()}})}
function choose(opts){return new Promise(r=>{SUB.innerHTML=(lastLine?`<div class="idle">${mark(lastLine)}</div>`:"")+`<div class="choices">${opts.map((o,i)=>`<button class="ch" data-i="${i}">${o[0]}<small>${o[1]}</small></button>`).join("")}</div>`;
  SUB.querySelectorAll(".ch").forEach(b=>b.onclick=e=>{e.stopPropagation();sfx("click");r(opts[+b.dataset.i][2])})})}
function idle(){if(!G||G.over||G.mode!=="walk")return;SUB.innerHTML=`<div class="idle">◀ ▶ 走路。觉得哪里不对劲，就<b>往回走</b>；一切正常，就<b>继续往前</b>。<br>🔍 可以凑近看招牌和文字。</div>`}
SUB.addEventListener("click",e=>{ac();const a=e.target.dataset&&e.target.dataset.a;
  if(a==="spk"){e.stopPropagation();if(lastLine)speak(lastLine,1.05,.85);return}
  if(a==="zh"){e.stopPropagation();const z=SUB.querySelector(".zh");if(z)z.hidden=!z.hidden;return}
  if(adv)adv()});

/* ===== modal ===== */
const MOD=$("#modal");let mseq=0;
function modal(html,setup){return new Promise(res=>{const id=++mseq;let done=0;MOD.className="show";MOD.innerHTML=`<div class="mbox">${html}</div>`;if(G)G.modal=true;
  const close=v=>{if(done)return;done=1;if(id===mseq){MOD.className="";MOD.innerHTML="";if(G)G.modal=false}res(v)};
  MOD.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{sfx("click");close(b.dataset.close)});setup&&setup(MOD,close)})}

/* ===== drawing helpers ===== */
let CX=0;const g=ctx;
const rect=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x-CX,y,w,h)};
const txt=(s,x,y,size,c,al="center",f="bold")=>{g.fillStyle=c;g.font=`${f} ${size}px Georgia,"Times New Roman",serif`;g.textAlign=al;g.textBaseline="middle";g.fillText(s,x-CX,y)};
const K="#09090b";
function human(x,y,face,ph,o={}){
  const X=x-CX,s=o.s||1;g.save();g.translate(X,y);g.scale(face*s,s);g.strokeStyle=o.c||K;g.fillStyle=o.c||K;g.lineCap="round";g.lineJoin="round";
  const sw=Math.sin(ph)*.55,lift=Math.abs(Math.cos(ph))*1.5;
  if(o.sit){g.lineWidth=6;g.beginPath();g.moveTo(0,-28);g.lineTo(14,-28);g.lineTo(14,-4);g.moveTo(-2,-28);g.lineTo(12,-30);g.lineTo(12,-4);g.stroke();g.beginPath();g.ellipse(0,-42,8,15,0,0,7);g.fill();g.beginPath();g.arc(1,-63,7,0,7);g.fill();g.restore();return}
  g.lineWidth=6;
  g.beginPath();g.moveTo(0,-30);g.lineTo(Math.sin(sw)*16,-1);g.moveTo(0,-30);g.lineTo(-Math.sin(sw)*16,-1);g.stroke();
  if(o.coat){g.beginPath();g.moveTo(-8,-56);g.lineTo(8,-56);g.lineTo(11,-18);g.lineTo(-11,-18);g.fill()}
  else{g.beginPath();g.ellipse(0,-43,8,15,0,0,7);g.fill()}
  if(o.pack){g.beginPath();g.roundRect?g.roundRect(-15,-54,9,20,3):g.rect(-15,-54,9,20);g.fill()}
  g.lineWidth=5;g.beginPath();g.moveTo(0,-53);g.lineTo(-Math.sin(sw)*12,-30);g.moveTo(0,-53);g.lineTo(Math.sin(sw)*12+2,-30);g.stroke();
  g.beginPath();g.arc(1,-64-lift*.3,7.5,0,7);g.fill();
  g.restore();
}
const grain=document.createElement("canvas");grain.width=grain.height=128;{const gg=grain.getContext("2d"),im=gg.createImageData(128,128);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}gg.putImageData(im,0,0)}
let grainPat=null;

/* ===== scene ===== */
function A(k){return G.an===k}
function bgLayer(){
  const sk=g.createLinearGradient(0,0,0,GY);sk.addColorStop(0,"#121318");sk.addColorStop(.75,"#34363d");sk.addColorStop(1,"#4a4c52");g.fillStyle=sk;g.fillRect(0,0,VW,GY);
  const mx=VW*.78-CX*.05;g.fillStyle="#d8d6cf";g.beginPath();g.arc(mx,54,15,0,7);g.fill();g.fillStyle="#1a1b20";g.beginPath();g.arc(mx+7,50,13,0,7);g.fill();
  if(A("moon")){g.fillStyle="#d8d6cf";g.beginPath();g.arc(mx-120,78,13,0,7);g.fill();g.fillStyle="#22232a";g.beginPath();g.arc(mx-126,74,11,0,7);g.fill()}
  const off=CX*.35;g.fillStyle="#1d1e23";
  const B=[[0,120],[70,170],[140,100],[230,190],[300,140],[390,160],[470,110],[560,180],[640,130],[720,170],[800,120],[880,150]];
  for(const[bx,bh]of B){const x=bx-off;g.fillRect(x,GY-bh,66,bh);
    for(let wy=GY-bh+14;wy<GY-30;wy+=22)for(let wx=x+10;wx<x+60;wx+=18){const lit=A("window")||(bx===230&&wy===GY-bh+36&&wx===x+28);if(lit){g.fillStyle="#cfc8b4";g.fillRect(wx,wy,8,11);g.fillStyle=K;g.fillRect(wx+2,wy+3,4,8);g.beginPath();g.arc(wx+4,wy+3,2.2,0,7);g.fill();g.fillStyle="#1d1e23"}}}
  const fog=g.createLinearGradient(0,GY-90,0,GY);fog.addColorStop(0,"rgba(80,82,88,0)");fog.addColorStop(1,"rgba(80,82,88,.55)");g.fillStyle=fog;g.fillRect(0,GY-90,VW,90);
}
function lamp(x,red){rect(x-2,140,4,GY-140,K);rect(x-2,140,22,3,K);rect(x+12,141,14,6,K);
  const lx=x+19-CX,gr=g.createLinearGradient(0,147,0,GY);const c=red?"210,52,44":"235,232,220";gr.addColorStop(0,`rgba(${c},.42)`);gr.addColorStop(1,`rgba(${c},0)`);g.fillStyle=gr;g.beginPath();g.moveTo(lx-6,147);g.lineTo(lx+6,147);g.lineTo(lx+52,GY);g.lineTo(lx-52,GY);g.fill();
  g.fillStyle=red?"#e04a3c":"#f2efe4";g.fillRect(lx-6,146,12,2)}

function hud(){$("#clk").textContent=String(G.min/60|0).padStart(2,"0")+":"+String(G.min%60).padStart(2,"0");$("#bat").textContent="🔋"+G.bat+"%";$("#bPh").classList.toggle("dot",G.unread>0)}
function text(from,en,zh){G.msgs.push([from,en,zh]);G.unread++;sfx("buzz");hud();cap(`📱 ${from}: ${en}`,`${from}：${zh}`)}
async function leave(dir){
  if(G.busy)return;G.busy=true;
  const ok=dir<0?!!G.an:!G.an,prev=G.an;
  G.loop++;G.min+=2;if(G.loop%2===0&&G.bat>2)G.bat--;
  if(ok){G.count++;sfx("ok")}else{G.mist++;G.count=0;sfx("bad")}
  hud();await wait(250);
  if(!ok){await say(dir<0?"Wait. Nothing was wrong back there. I turned back for nothing.":"Something was wrong back there. "+AN[prev][0],dir<0?"等等。刚才什么问题都没有。我白往回走了。":"刚才那里有不对劲的地方。"+AN[prev][1]);
    if(G.mist===1)await say("Behind me, at the corner... someone is standing there.","我身后，街角那里……站着一个人。");
    if(G.mist===3)await say("They're closer now. I can't make another mistake.","那个人更近了。我不能再出错了。");
    if(G.mist>=4){G.busy=false;return ending("caught","walk")}}
  if(G.count>=8){G.busy=false;return finale()}
  G.an=pickAn();G.x=90;G.face=1;
  G.still=0;G.echoN=0;G.phoneDone=false;G.sh=0;
  const st=STORY[G.loop];G.busy=false;
  if(st&&!A("phone"))setTimeout(()=>{if(G&&!G.over&&G.mode==="walk")text(st[0],st[1],st[2])},1200);
  else idle();
}
function update(dt){
  G.t+=dt;if(G.busy||G.modal||G.over)return;
  const k=G.keys,v=(k.r?1:0)-(k.l?1:0);
  if(G.mode==="bus"){if(G.bus&&G.bus.x>G.bus.tx)G.bus.x-=Math.max(30,(G.bus.x-G.bus.tx)*1.6)*dt;if(v&&!G.choosing){G.x=Math.max(60,Math.min(420,G.x+v*70*dt));G.face=v;G.walk+=dt*9}return}
  if(v){G.x+=v*78*dt;G.face=v;const pw=G.walk;G.walk+=dt*9;if(Math.floor(pw/Math.PI)!==Math.floor(G.walk/Math.PI))sfx("step");G.still=0;G.sh=Math.max(0,G.sh-dt*30)}
  else{G.still+=dt;G.sh=Math.min(20,G.sh+dt*20);if(A("steps")&&G.still>.6&&G.echoN<4&&G.still>.6+G.echoN*.5){G.echoN++;sfx("echo")}}
  if(A("phone")&&!G.phoneDone&&G.x>380){G.phoneDone=true;text("Unknown","you dropped something. come back.","你掉东西了。回来。")}
  if(G.x<-12)leave(-1);else if(G.x>LEN+12)leave(1);
}

async function finale(){
  G.mode="bus";G.x=120;G.face=1;G.an=null;G.busy=true;G.min=23*60+39;hud();setAmb("drone",.06);
  await say("The bus stop. Finally. It's 23:39.","公交站。终于到了。23:39。");
  G.busFake=Math.random()<.5?rnd(Object.keys(BUSV)):null;
  await say("Headlights. The last bus is coming.","车灯。末班车来了。");
  sfx("bus");G.bus={x:CX+VW+40,tx:430};G.busy=false;idle();SUB.innerHTML='<div class="idle">车停下后可以走近看清楚（🔍 也能用）。准备好了就做决定。</div>';
  await wait(3500);sfx("door");G.choosing=true;
  const c=await choose([["Get on the bus","上车","on"],["Let it go","不上这辆车","off"]]);G.choosing=false;G.busy=true;
  if(c==="on"){if(G.busFake)return ending("wrong");return ending(G.mist<=1?"true":"home")}
  if(!G.busFake){await say("The doors close. The N8 drives away without me.","车门关上了。N8 开走了，没有等我。");return ending("caught","missed")}
  await say("The doors close. The bus drives into the fog... and disappears.","车门关上了。那辆车开进雾里……消失了。");
  await say("Two minutes later, another pair of headlights.","两分钟后，又一对车灯亮了起来。");
  G.busFake=null;G.bus={x:CX+VW+40,tx:430};sfx("bus");G.busy=false;await wait(3500);G.busy=true;sfx("door");
  await say("N8. Maple Ave. The driver nods at me.","N8，Maple Ave。司机朝我点了点头。");return ending(G.mist<=1?"true":"home");
}

/* ===== input, loop, layout ===== */
function hold(el,k){const on=e=>{e.preventDefault();ac();if(G)G.keys[k]=1;el.classList.add("on")},off=()=>{if(G)G.keys[k]=0;el.classList.remove("on")};el.addEventListener("pointerdown",on);["pointerup","pointerleave","pointercancel"].forEach(t=>el.addEventListener(t,off));el.addEventListener("contextmenu",e=>e.preventDefault())}
hold($("#bL"),"l");hold($("#bR"),"r");
$("#bLook").onclick=()=>{ac();look()};$("#bPh").onclick=()=>{ac();phone()};$("#hSet").onclick=()=>{ac();settings()};
addEventListener("keydown",e=>{if(!G)return;if(e.key==="ArrowLeft"||e.key==="a")G.keys.l=1;if(e.key==="ArrowRight"||e.key==="d")G.keys.r=1;if(e.key===" "||e.key==="Enter"){if(adv){e.preventDefault();adv()}else if(!G.modal){e.preventDefault();look()}}});
addEventListener("keyup",e=>{if(!G)return;if(e.key==="ArrowLeft"||e.key==="a")G.keys.l=0;if(e.key==="ArrowRight"||e.key==="d")G.keys.r=0});
let lt=0;function frame(ts){const dt=Math.min(.05,(ts-lt)/1000||0);lt=ts;if(G&&G.started)update(dt);draw();requestAnimationFrame(frame)}
function layout(){const vw=innerWidth,vh=innerHeight,land=vw>vh*1.2&&vh<640;document.body.classList.toggle("land",land);
  VW=(!land&&vw<vh)?Math.max(300,Math.min(640,Math.round(VH*vw/(vh*.46)))):640;
  const aw=land?vw-350:vw,ah=land?vh-12:vh-250;SC=Math.min(aw/VW,ah/VH);const w=Math.floor(VW*SC),h=Math.floor(VH*SC);
  const st=$("#stage");st.style.width=w+"px";st.style.height=h+"px";cv.width=Math.round(w*devicePixelRatio);cv.height=Math.round(h*devicePixelRatio);grainPat=null}
addEventListener("resize",layout);layout();
function settings(){const row=(k,t)=>`<div class="tog"><span>${t}</span><button class="sw ${SET[k]?"on":""}" data-k="${k}"></button></div>`;
  return modal(`<h2>设置</h2>${row("sfx","音效")}${row("voice","自动朗读英文")}${row("zh","字幕默认显示中文")}<p class="hint">这个游戏很依赖声音，建议戴耳机。</p><div class="row"><button class="btn pri" data-close>好</button></div>`,m=>m.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{const k=b.dataset.k;SET[k]=!SET[k];b.classList.toggle("on",SET[k]);LS.set("set",SET);if(k==="sfx"&&master)master.gain.value=SET.sfx?.9:0;if(k==="voice"&&!SET.voice&&tts)tts.cancel()}))}
function title(){const got=LS.get("end",[]);
  modal(`<div style="text-align:center"><div class="title">LAST BUS</div><p class="hint" style="font-size:14px;margin:6px 0 0">末班车 · 微恐 · 英文字幕</p></div>
  <p style="margin-top:14px">加班到深夜。末班车 23:40 发车，公交站就在 Elm 街的尽头，只隔几个街区。</p>
  <p>可是这条街，好像怎么也走不完。</p>
  <p class="hint">玩法：◀ ▶ 走路（电脑可用方向键）。留意街上的一切：招牌上的字、灯、人、声音。觉得哪里不对劲就往回走；一切正常就继续往前。🔍 凑近读文字，📱 看消息。大约 15–25 分钟，<b>一定要戴耳机</b>。</p>
  <div class="gal">${ORDER.map((id,i)=>got.includes(id)?`<div><b>${END[id].t}</b>${END[id].z}</div>`:`<div class="lock"><b>???</b>结局 ${i+1}</div>`).join("")}</div>
  <div class="row"><button class="btn pri" data-close="go" style="flex:1;font-size:17px">下班</button><button class="btn" id="ts">设置</button></div>
  <p class="hint" style="text-align:center"><a href="../" style="color:var(--dim)">← 回到游戏大厅</a></p>`,m=>{m.querySelector("#ts").onclick=()=>settings().then(title)}).then(v=>{if(v==="go")start()})}
async function start(){ac();G.started=true;G.busy=true;setAmb("rain",.12);setAmb("drone",.025);hud();
  await say("23:21. If I hurry, I can still catch the last bus.","23:21。快点的话还能赶上末班车。");
  await say("The bus stop is at the end of Elm Street. Just a few blocks.","公交站在 Elm 街的尽头，就几个街区。");
  await say("Same street as every night. Same lamps, same signs, same shop. I know it by heart.","每天晚上都走这条街。一样的路灯、一样的招牌、一样的店。我闭着眼都认得。");
  G.busy=false;idle()}
newGame();hud();requestAnimationFrame(frame);title();
</script>
</body>
</html>
